</head>
<body>

  <div class="app">
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand sidebar-brand--compact">

      </div>

      <nav class="sidebar-nav">

        <a href="index.html" class="nav-item">
          <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></span>
          <span class="nav-text">Dashboard</span>
        </a>
        <a href="order.html" class="nav-item active">
          <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/></svg></span>
          <span class="nav-text">訂單管理</span>
        </a>
        <a href="inventory.html" class="nav-item">
          <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg></span>
          <span class="nav-text">庫存管理</span>
        </a>
        <a href="shipping.html" class="nav-item">
          <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M1 3h15v13H1zM16 8h4l3 3v5h-7V8z"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg></span>
          <span class="nav-text">出貨管理</span>
        </a>
        <a href="laundry.html" class="nav-item">
          <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"/></svg></span>
          <span class="nav-text">洗滌管理</span>

        <a href="analytics.html" class="nav-item">
          <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg></span>
          <span class="nav-text">報表分析</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="user-pill">
          <div class="user-avatar">林</div>
          <div class="user-meta">
            <div class="name">林曉雯</div>
            <div class="role">營運總監</div>
          </div>
        </div>
      </div>
    </aside>

    <main class="main">
      <header class="header">
        <div class="header-left">
          <button class="menu-toggle" id="menuToggle" type="button" aria-label="選單">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
          </button>
          <nav class="breadcrumb">
            <a href="index.html">Dashboard</a>
            <span> / </span>
            <strong>訂單管理</strong>
          </nav>
        </div>
        <div class="header-actions">
          <button type="button" class="btn-gold" id="btnNewOrder">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
            建立訂單
          </button>
          <a href="index.html" class="header-logo" title="舞韻舞蹈服飾 ERP">
            <span class="header-logo-mark" aria-hidden="true">舞</span>
            <span class="header-logo-text"><strong>舞韻</strong><small>DANCE ERP</small></span>
          </a>
        </div>
      </header>

      <div class="content">
        <div class="page-intro">
          <h2>訂單管理</h2>
          <p>管理學校成果展、舞蹈比賽與商演檔期的服裝租借訂單</p>
        </div>

        <div class="toolbar">
          <label class="search-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
            <input type="search" id="searchInput" placeholder="搜尋訂單編號、客戶、服裝款式…" autocomplete="off" />
          </label>
          <div class="toolbar-actions">
            <button type="button" class="btn-ghost" id="btnExport">匯出列表</button>
            <button type="button" class="btn-ghost" id="btnReset">重設篩選</button>
          </div>
        </div>

        <div class="filter-bar" id="filterBar" role="group" aria-label="訂單狀態篩選"></div>

        <div class="result-bar">
          <span>共 <em id="resultCount">0</em> 筆訂單</span>
          <span id="filterHint">顯示全部狀態</span>
        </div>

        <div class="table-card">
          <div class="table-wrap">
            <table class="order-table">
              <thead>
                <tr>
                  <th>訂單編號</th>
                  <th>客戶名稱</th>
                  <th>服裝款式</th>
                  <th>活動類型</th>
                  <th>表演日期</th>
                  <th>出貨日期</th>
                  <th>套數</th>
                  <th>狀態</th>
                  <th>金額</th>
                </tr>
              </thead>
              <tbody id="orderBody"></tbody>
            </table>
          </div>
          <div class="empty-state" id="emptyState">
            <p>找不到符合條件的訂單</p>
            <span>試試調整搜尋關鍵字或篩選條件</span>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script>
    const STATUS_MAP = {
      pending:  { label: '待確認', cls: 'pending' },
      modify:   { label: '待修改', cls: 'modify' },
      ready:    { label: '待出貨', cls: 'ready' },
      shipped:  { label: '已出貨', cls: 'shipped' },
      returned: { label: '已歸還', cls: 'returned' },
      washing:  { label: '洗滌中', cls: 'washing' },
      stored:   { label: '已歸位', cls: 'stored' },
    };

    const FILTER_CHIPS = [
      { id: 'all', label: '全部' },
      { id: 'pending', label: '待確認' },
      { id: 'modify', label: '待修改' },
      { id: 'ready', label: '待出貨' },
      { id: 'shipped', label: '已出貨' },
      { id: 'returned', label: '已歸還' },
      { id: 'washing', label: '洗滌中' },
      { id: 'alert', label: '庫存不足' },
    ];

    const orders = [
      { id: 'WY-260518-001', customer: '嘉義女中舞蹈班', costume: '國風水袖服', event: '學校成果展', showDate: '2026-05-24', shipDate: '2026-05-18', qty: 18, status: 'ready', amount: 28800, stockLow: true },
      { id: 'WY-260518-002', customer: '台南民族舞團', costume: '客家花布舞裙', event: '舞蹈比賽', showDate: '2026-05-22', shipDate: '2026-05-18', qty: 14, status: 'modify', amount: 19600, stockLow: false },
      { id: 'WY-260518-003', customer: '星光兒童舞蹈教室', costume: '兒童芭蕾粉 Tutu', event: '學校成果展', showDate: '2026-05-25', shipDate: '2026-05-20', qty: 22, status: 'pending', amount: 22000, stockLow: true },
      { id: 'WY-260518-004', customer: '雲林表演藝術中心', costume: '敦煌飛天舞服', event: '商演活動', showDate: '2026-05-30', shipDate: '2026-05-26', qty: 30, status: 'pending', amount: 42000, stockLow: false },
      { id: 'WY-260518-005', customer: '高雄青春舞團', costume: '現代黑金流蘇服', event: '舞蹈比賽', showDate: '2026-05-28', shipDate: '2026-05-23', qty: 12, status: 'ready', amount: 16800, stockLow: false },
      { id: 'WY-260518-006', customer: '台南女子高中街舞社', costume: '街舞寬鬆套裝', event: '學校成果展', showDate: '2026-05-23', shipDate: '2026-05-18', qty: 12, status: 'ready', amount: 14400, stockLow: true },
      { id: 'WY-260519-007', customer: '新竹韻律街舞工作室', costume: '街舞連帽表演服', event: '商演活動', showDate: '2026-06-01', shipDate: '2026-05-27', qty: 16, status: 'pending', amount: 19200, stockLow: false },
      { id: 'WY-260520-008', customer: '屏東原舞團', costume: '原民羽飾套裝', event: '原民祭典', showDate: '2026-06-05', shipDate: '2026-05-30', qty: 10, status: 'pending', amount: 16500, stockLow: true },
      { id: 'WY-260521-009', customer: '台北耕莘舞集', costume: '現代舞霧面緊身衣', event: '畢業公演', showDate: '2026-06-08', shipDate: '2026-06-03', qty: 8, status: 'pending', amount: 12800, stockLow: false },
      { id: 'WY-260522-010', customer: '台中現代舞劇場', costume: '現代黑金流蘇服', event: '商演活動', showDate: '2026-06-10', shipDate: '2026-06-05', qty: 15, status: 'pending', amount: 21000, stockLow: false },
      { id: 'WY-260515-011', customer: '桃園全國舞蹈比賽籌備組', costume: '敦煌飛天舞服', event: '舞蹈比賽', showDate: '2026-05-20', shipDate: '2026-05-16', qty: 20, status: 'shipped', amount: 32000, stockLow: false },
      { id: 'WY-260514-012', customer: '花蓮阿美祭典舞隊', costume: '原民羽飾套裝', event: '原民祭典', showDate: '2026-05-19', shipDate: '2026-05-15', qty: 8, status: 'returned', amount: 14400, stockLow: false },
      { id: 'WY-260513-013', customer: '基隆海事職校舞蹈班', costume: '國風水袖服', event: '學校成果展', showDate: '2026-05-17', shipDate: '2026-05-13', qty: 12, status: 'washing', amount: 19200, stockLow: false },
      { id: 'WY-260512-014', customer: '彰化員林國中藝才班', costume: '客家花布舞裙', event: '學校成果展', showDate: '2026-05-16', shipDate: '2026-05-12', qty: 6, status: 'washing', amount: 8400, stockLow: false },
      { id: 'WY-260511-015', customer: '宜蘭蘭陽舞蹈節執委會', costume: '敦煌飛天舞服', event: '商演活動', showDate: '2026-05-14', shipDate: '2026-05-10', qty: 40, status: 'stored', amount: 56000, stockLow: false },
      { id: 'WY-260516-016', customer: '苗栗客家文化館', costume: '客家花布舞裙', event: '春節晚會', showDate: '2026-05-21', shipDate: '2026-05-17', qty: 9, status: 'shipped', amount: 12600, stockLow: false },
      { id: 'WY-260516-017', customer: '南投埔里國中舞蹈班', costume: '少數民族措朗舞袍', event: '學校成果展', showDate: '2026-05-26', shipDate: '2026-05-21', qty: 11, status: 'modify', amount: 15400, stockLow: true },
      { id: 'WY-260519-018', customer: '澎湖海上花火節舞團', costume: '肚皮舞亮片腰裙', event: '商演活動', showDate: '2026-06-12', shipDate: '2026-06-07', qty: 6, status: 'pending', amount: 9600, stockLow: false },
      { id: 'WY-260520-019', customer: '新北三芝國小舞蹈班', costume: '兒童芭蕾粉 Tutu', event: '學校成果展', showDate: '2026-06-02', shipDate: '2026-05-28', qty: 14, status: 'pending', amount: 14000, stockLow: false },
      { id: 'WY-260523-020', customer: '台南孔廟祭典舞蹈團', costume: '古典雲肩漢服套', event: '春節晚會', showDate: '2026-06-15', shipDate: '2026-06-10', qty: 18, status: 'pending', amount: 27000, stockLow: false },
    ];

    let activeFilter = 'all';
    let searchQuery = '';

    const alertIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v2m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/></svg>';

    function formatDate(str) {
      const d = new Date(str + 'T00:00:00');
      return d.toLocaleDateString('zh-TW', { month: 'short', day: 'numeric', weekday: 'short' });
    }

    function formatMoney(n) {
      return 'NT$ ' + n.toLocaleString('zh-TW');
    }

    function countByFilter(id) {
      if (id === 'all') return orders.length;
      if (id === 'alert') return orders.filter(o => o.stockLow).length;
      return orders.filter(o => o.status === id).length;
    }

    function renderFilterChips() {
      const bar = document.getElementById('filterBar');
      bar.innerHTML = FILTER_CHIPS.map(chip => {
        const count = countByFilter(chip.id);
        return `<button type="button" class="filter-chip${activeFilter === chip.id ? ' active' : ''}" data-filter="${chip.id}">${chip.label}<span class="count">${count}</span></button>`;
      }).join('');

      bar.querySelectorAll('.filter-chip').forEach(btn => {
        btn.addEventListener('click', () => {
          activeFilter = btn.dataset.filter;
          renderFilterChips();
          applyFilters();
        });
      });
    }

    function matchesFilter(order) {
      if (activeFilter === 'all') return true;
      if (activeFilter === 'alert') return order.stockLow;
      return order.status === activeFilter;
    }

    function matchesSearch(order) {
      if (!searchQuery) return true;
      const q = searchQuery.toLowerCase();
      return (
        order.id.toLowerCase().includes(q) ||
        order.customer.toLowerCase().includes(q) ||
        order.costume.toLowerCase().includes(q) ||
        order.event.toLowerCase().includes(q)
      );
    }

    function applyFilters() {
      const filtered = orders.filter(o => matchesFilter(o) && matchesSearch(o));
      renderTable(filtered);

      const hint = document.getElementById('filterHint');
      if (activeFilter === 'all') hint.textContent = '顯示全部狀態';
      else if (activeFilter === 'alert') hint.textContent = '僅顯示庫存不足訂單';
      else hint.textContent = `篩選：${STATUS_MAP[activeFilter]?.label || ''}`;
    }

    function renderTable(filtered) {
      const tbody = document.getElementById('orderBody');
      const empty = document.getElementById('emptyState');
      document.getElementById('resultCount').textContent = filtered.length;

      if (filtered.length === 0) {
        tbody.innerHTML = '';
        empty.classList.add('show');
        return;
      }

      empty.classList.remove('show');

      tbody.innerHTML = filtered.map(o => {
        const st = STATUS_MAP[o.status];
        const stockTag = o.stockLow
          ? `<span class="tag-stock">${alertIcon}庫存不足</span>`
          : '';

        return `
          <tr class="${o.stockLow ? 'row-alert' : ''}" data-id="${o.id}">
            <td><span class="cell-id">${o.id}</span></td>
            <td><span class="cell-customer">${o.customer}</span></td>
            <td><span class="cell-costume" title="${o.costume}">${o.costume}</span></td>
            <td><span class="cell-event">${o.event}</span></td>
            <td class="cell-date">${formatDate(o.showDate)}</td>
            <td class="cell-date">${formatDate(o.shipDate)}</td>
            <td><span class="cell-qty">${o.qty}</span> 套</td>
            <td>
              <span class="badge ${st.cls}">${st.label}</span>
              ${stockTag}
            </td>
            <td class="cell-amount">${formatMoney(o.amount)}</td>
          </tr>
        `;
      }).join('');
    }

    function initSidebar() {
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('sidebarOverlay');
      const close = () => {
        sidebar?.classList.remove('open');
        overlay?.classList.remove('open');
      };
      document.getElementById('menuToggle')?.addEventListener('click', () => {
        sidebar.classList.toggle('open');
        overlay.classList.toggle('open');
      });
      overlay?.addEventListener('click', close);
    }

    document.getElementById('searchInput').addEventListener('input', e => {
      searchQuery = e.target.value.trim();
      applyFilters();
    });

    document.getElementById('btnReset').addEventListener('click', () => {
      searchQuery = '';
      activeFilter = 'all';
      document.getElementById('searchInput').value = '';
      renderFilterChips();
      applyFilters();
    });

    document.getElementById('btnExport').addEventListener('click', () => {
      alert('訂單列表匯出（示範）：將產生目前篩選結果 CSV');
    });

    document.getElementById('btnNewOrder').addEventListener('click', () => {
      alert('建立訂單（示範）：開啟新增租借單表單');
    });

    renderFilterChips();
    applyFilters();
    initSidebar();
  </script>
</body>
</html>
