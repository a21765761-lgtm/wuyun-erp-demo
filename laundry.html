<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>舞韻舞蹈服飾 ERP · 洗滌管理</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600;700&family=Noto+Serif+TC:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="brand.css" />
</head>
<body>
  <div class="stage-bg" aria-hidden="true">
    <div class="neon-grid"></div>
    <div class="neon-beam neon-beam-1"></div>
    <div class="neon-beam neon-beam-2"></div>
    <div class="neon-beam neon-beam-3"></div>
    <div class="spotlight-main"></div>
    <div class="spotlight spotlight-left"></div>
    <div class="spotlight spotlight-right"></div>
    <div class="spotlight spotlight-purple"></div>
    <div class="stage-vignette"></div>
    <div class="stage-floor"></div>
  </div>

  <div class="app">
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand sidebar-brand--compact">
        <p class="sidebar-eyebrow">舞台營運 · 導航</p>
      </div>

      <nav class="sidebar-nav">
        <p class="nav-label">舞台導航</p>
        <a href="index.html" class="nav-item">
          <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></span>
          <span class="nav-text">Dashboard</span>
        </a>
        <a href="order.html" class="nav-item">
          <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/></svg></span>
          <span class="nav-text">訂單管理</span>
        </a>
        <a href="inventory.html" class="nav-item">
          <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg></span>
          <span class="nav-text">庫存管理</span>
        </a>
        <a href="shipping.html" class="nav-item">
          <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M1 3h15v13H1zM16 8h4l3 3v5h-7V8z"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg></span>
          <span class="nav-text">出貨管理</span>
        </a>
        <a href="laundry.html" class="nav-item active">
          <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"/></svg></span>
          <span class="nav-text">洗滌管理</span>
        </a>
        <a href="analytics.html" class="nav-item">
          <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg></span>
          <span class="nav-text">報表分析</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="user-pill">
          <div class="user-avatar">林</div>
          <div class="user-meta">
            <div class="name">林曉雯</div>
            <div class="role">營運總監</div>
          </div>
        </div>
      </div>
    </aside>

    <main class="main">
      <header class="header">
        <div class="header-left">
          <button class="menu-toggle" id="menuToggle" type="button" aria-label="選單">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
          </button>
          <nav class="breadcrumb">
            <a href="index.html">Dashboard</a>
            <span> / </span>
            <strong>洗滌與歸位</strong>
          </nav>
        </div>
        <div class="header-actions">
          <button type="button" class="btn-gold">登記歸還</button>
          <a href="index.html" class="header-logo" title="舞韻舞蹈服飾 ERP">
            <span class="header-logo-mark" aria-hidden="true">舞</span>
            <span class="header-logo-text"><strong>舞韻</strong><small>DANCE ERP</small></span>
          </a>
        </div>
      </header>

      <div class="content">
        <div class="page-intro">
          <h2>洗滌與歸位管理</h2>
          <p>從歸還清點到洗滌、晾曬、上架，完整追蹤每一件表演服的生命週期</p>
        </div>

        <div class="kpi-grid">
          <article class="kpi-card">
            <div class="kpi-label">今日待洗滌</div>
            <div class="kpi-value" id="kpiWaitWash">0</div>
          </article>
          <article class="kpi-card">
            <div class="kpi-label">洗滌中</div>
            <div class="kpi-value cyan" id="kpiWashing">0</div>
          </article>
          <article class="kpi-card">
            <div class="kpi-label">待晾曬</div>
            <div class="kpi-value" id="kpiDrying">0</div>
          </article>
          <article class="kpi-card">
            <div class="kpi-label">待歸位</div>
            <div class="kpi-value gold" id="kpiWaitShelf">0</div>
          </article>
          <article class="kpi-card">
            <div class="kpi-label">今日完成歸位</div>
            <div class="kpi-value success" id="kpiDoneShelf">0</div>
          </article>
        </div>

        <section class="workflow-section">
          <h3>工作流程</h3>
          <div class="workflow-track">
            <div class="workflow-line"><div class="workflow-line-fill"></div></div>
            <div class="workflow-steps" id="workflowSteps"></div>
          </div>
        </section>

        <section class="table-section">
          <div class="table-head-bar">
            <h3>洗滌工作列表</h3>
            <p class="table-hint">共 <em id="tableCount">0</em> 件 · 點擊流程節點可篩選</p>
          </div>
          <div class="table-card">
            <div class="table-wrap">
              <table class="laundry-table">
                <thead>
                  <tr>
                    <th>訂單編號</th>
                    <th>服裝名稱</th>
                    <th>配件數量</th>
                    <th>歸還狀況</th>
                    <th>洗滌狀態</th>
                    <th>晾曬狀態</th>
                    <th>櫃位位置</th>
                    <th>負責人員</th>
                  </tr>
                </thead>
                <tbody id="laundryBody"></tbody>
              </table>
            </div>
            <div class="empty-table" id="emptyTable">尚無符合條件的工作項目</div>
          </div>
        </section>
      </div>
    </main>
  </div>

  <script>
    const warnIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v2m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/></svg>`;

    const WORKFLOW = [
      { id: 'returned', label: '已歸還', icon: '↩' },
      { id: 'counting', label: '待清點', icon: '☐' },
      { id: 'wait-wash', label: '待洗滌', icon: '◇' },
      { id: 'washing', label: '洗滌中', icon: '◆' },
      { id: 'drying', label: '晾曬中', icon: '☀' },
      { id: 'wait-shelf', label: '待歸位', icon: '▣' },
      { id: 'shelved', label: '已歸位', icon: '✓' },
    ];

    const items = [
      { orderId: 'WY-260518-002', garment: '客家花布舞裙', qty: 14, stage: 'counting', returnStatus: '缺件', washStatus: '—', dryStatus: '—', location: '歸還暫存區', staff: '陳美玲', missing: ['銀飾腰鍊缺少', '頭巾缺少 2 件'] },
      { orderId: 'WY-260514-011', garment: '原民羽飾套裝', qty: 8, stage: 'washing', returnStatus: 'complete', washStatus: '洗滌中', dryStatus: '—', location: '洗滌區-A線', staff: '王志明', missing: [] },
      { orderId: 'WY-260513-012', garment: '敦煌飛天舞服', qty: 12, stage: 'washing', returnStatus: 'complete', washStatus: '洗滌中', dryStatus: '—', location: '洗滌區-A線', staff: '陳美玲', missing: [] },
      { orderId: 'WY-260512-013', garment: '國風水袖服', qty: 6, stage: 'drying', returnStatus: 'complete', washStatus: '已完成', dryStatus: '晾曬中', location: '晾曬區-2F', staff: '張雅文', missing: [] },
      { orderId: 'WY-260516-017', garment: '客家花布舞裙', qty: 9, stage: 'wait-shelf', returnStatus: 'complete', washStatus: '已完成', dryStatus: '已晾曬', location: 'B區-2層-05格', staff: '林佳穎', missing: [] },
      { orderId: 'WY-260511-014', garment: '敦煌飛天舞服', qty: 40, stage: 'wait-wash', returnStatus: 'complete', washStatus: '待洗滌', dryStatus: '—', location: '待洗區-排隊', staff: '陳美玲', missing: [] },
      { orderId: 'WY-260515-010', garment: '現代黑金流蘇服', qty: 20, stage: 'drying', returnStatus: 'complete', washStatus: '已完成', dryStatus: '晾曬中', location: '晾曬區-1F', staff: '王志明', missing: [] },
      { orderId: 'WY-260508-021', garment: '少數民族措朗舞袍', qty: 7, stage: 'returned', returnStatus: '待清點', washStatus: '—', dryStatus: '—', location: '歸還暫存區 · 延遲', staff: '—', missing: [] },
      { orderId: 'WY-260518-003', garment: '兒童芭蕾粉 Tutu', qty: 22, stage: 'wait-wash', returnStatus: '待清點', washStatus: '—', dryStatus: '—', location: '歸還暫存區', staff: '—', missing: [] },
      { orderId: 'WY-260506-022', garment: '街舞寬鬆套裝', qty: 25, stage: 'shelved', returnStatus: 'complete', washStatus: '已完成', dryStatus: '已晾曬', location: 'C區-4層-02格', staff: '張雅文', missing: [] },
      { orderId: 'WY-260510-015', garment: '肚皮舞亮片腰裙', qty: 15, stage: 'washing', returnStatus: 'complete', washStatus: '洗滌中', dryStatus: '—', location: '洗滌區-B線', staff: '陳美玲', missing: [] },
      { orderId: 'WY-260509-025', garment: '泰雅族編織舞衣', qty: 5, stage: 'counting', returnStatus: '缺件', washStatus: '—', dryStatus: '—', location: 'A區-1層-04格', staff: '林佳穎', missing: ['羽飾頭冠缺少'] },
      { orderId: 'WY-260507-026', garment: '現代黑金流蘇服', qty: 8, stage: 'shelved', returnStatus: 'complete', washStatus: '已完成', dryStatus: '已晾曬', location: 'C區-1層-03格', staff: '王志明', missing: [] },
      { orderId: 'WY-260505-027', garment: '國風水袖服', qty: 10, stage: 'wait-shelf', returnStatus: 'complete', washStatus: '已完成', dryStatus: '已晾曬', location: 'A區-3層-15格', staff: '張雅文', missing: [] },
    ];

    let activeStage = 'all';

    function countByStage(stage) {
      if (stage === 'all') return items.length;
      return items.filter(i => i.stage === stage).length;
    }

    function updateKpis() {
      document.getElementById('kpiWaitWash').textContent = countByStage('wait-wash') + countByStage('counting');
      document.getElementById('kpiWashing').textContent = countByStage('washing');
      document.getElementById('kpiDrying').textContent = countByStage('drying');
      document.getElementById('kpiWaitShelf').textContent = countByStage('wait-shelf');
      document.getElementById('kpiDoneShelf').textContent = countByStage('shelved');
    }

    function renderWorkflow() {
      const container = document.getElementById('workflowSteps');
      container.innerHTML = WORKFLOW.map(step => {
        const count = countByStage(step.id);
        const active = activeStage === step.id ? 'active' : '';
        return `
          <button type="button" class="flow-step ${active}" data-stage="${step.id}">
            <div class="step-icon">${step.icon}</div>
            <div class="step-name">${step.label}</div>
            <div class="step-count">${count}</div>
          </button>
        `;
      }).join('');

      document.getElementById('workflowSteps').addEventListener('click', e => {
        const btn = e.target.closest('.flow-step');
        if (!btn) return;
        activeStage = btn.dataset.stage;
        document.querySelectorAll('.flow-step').forEach(s => {
          s.classList.toggle('active', s.dataset.stage === activeStage);
        });
        renderTable();
      });
    }

    function renderReturnCell(item) {
      if (item.missing.length > 0) {
        return `
          <div class="missing-list">
            ${item.missing.map(m => `<span class="missing-tag">${warnIcon}${m}</span>`).join('')}
          </div>
        `;
      }
      if (item.returnStatus === 'complete') {
        return `<span class="return-ok">清點完成</span>`;
      }
      return `<span class="status-pill pending">${item.returnStatus}</span>`;
    }

    function washPill(status) {
      if (status === '—') return `<span class="status-pill pending">—</span>`;
      if (status === '洗滌中') return `<span class="status-pill wash">${status}</span>`;
      if (status === '待洗滌') return `<span class="status-pill progress">${status}</span>`;
      return `<span class="status-pill ok">${status}</span>`;
    }

    function dryPill(status) {
      if (status === '—') return `<span class="status-pill pending">—</span>`;
      if (status === '晾曬中') return `<span class="status-pill dry">${status}</span>`;
      if (status === '已晾曬') return `<span class="status-pill ok">${status}</span>`;
      return `<span class="status-pill progress">${status}</span>`;
    }

    function renderTable() {
      const filtered = activeStage === 'all'
        ? items
        : items.filter(i => i.stage === activeStage);

      document.getElementById('tableCount').textContent = filtered.length;
      const tbody = document.getElementById('laundryBody');
      const empty = document.getElementById('emptyTable');

      if (filtered.length === 0) {
        tbody.innerHTML = '';
        empty.classList.add('show');
        return;
      }

      empty.classList.remove('show');

      tbody.innerHTML = filtered.map(item => `
        <tr class="${item.missing.length ? 'row-missing' : ''}">
          <td><span class="cell-order">${item.orderId}</span></td>
          <td>
            <div class="cell-garment">
              <div class="garment-thumb">${item.garment.slice(0, 1)}</div>
              <span class="garment-name">${item.garment}</span>
            </div>
          </td>
          <td><span class="qty-badge">${item.qty}</span> 件</td>
          <td>${renderReturnCell(item)}</td>
          <td>${washPill(item.washStatus)}</td>
          <td>${dryPill(item.dryStatus)}</td>
          <td><span class="loc-tag">${item.location}</span></td>
          <td><span class="staff-name">${item.staff}</span></td>
        </tr>
      `).join('');
    }

    function initSidebar() {
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('sidebarOverlay');
      const close = () => {
        sidebar?.classList.remove('open');
        overlay?.classList.remove('open');
      };
      document.getElementById('menuToggle')?.addEventListener('click', () => {
        sidebar.classList.toggle('open');
        overlay.classList.toggle('open');
      });
      overlay?.addEventListener('click', close);
      document.querySelectorAll('.sidebar-nav .nav-item[href]').forEach(link => {
        link.addEventListener('click', () => {
          if (window.innerWidth <= 768) close();
        });
      });
      const current = (location.pathname.split('/').pop() || 'index.html').toLowerCase();
      document.querySelectorAll('.sidebar-nav .nav-item[href]').forEach(a => {
        a.classList.toggle('active', a.getAttribute('href').toLowerCase() === current);
      });
    }

    updateKpis();
    renderWorkflow();
    renderTable();
    initSidebar();
  </script>
</body>
</html>
