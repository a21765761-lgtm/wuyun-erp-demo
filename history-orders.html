<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>歷史訂單｜舞韻</title>
  <link rel="stylesheet" href="styles/erp-layout.css" />
  <style>
    #history-list p { color: #94a3b8; padding: 24px 0; }
    .card h3 { margin: 0 0 8px; color: #2dd4bf; }
    .order-meta { font-size: 0.9rem; color: #cbd5e1; margin-bottom: 12px; }
    .status-done {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(110, 231, 183, 0.15);
      color: #6ee7b7;
      font-size: 0.8rem;
    }
    .order-items { margin: 12px 0 0; padding-left: 20px; color: #e2e8f0; line-height: 1.8; }
  </style>
</head>
<body>

<div id="sidebar"></div>

<main class="main">
  <h1 class="page-title">歷史訂單</h1>
  <div id="history-list"></div>
</main>

<script>
const historyOrders = JSON.parse(
  localStorage.getItem("historyOrders")
) || [];

const list = document.getElementById("history-list");

if (historyOrders.length === 0) {
  list.innerHTML = "<p>目前沒有歷史訂單</p>";
} else {
  historyOrders.forEach(order => {
    const div = document.createElement("div");
    div.className = "card";

    const itemsHtml = (order.items || [])
      .map(item => {
        const name = item.productName || "品項";
        const size = item.size ? ` · ${item.size}` : "";
        const qty = item.quantity ?? 1;
        return `<li>${name}${size} × ${qty}</li>`;
      })
      .join("");

    div.innerHTML = `
      <h3>訂單 #${order.id} <span class="status-done">${order.status || "完成"}</span></h3>
      <p class="order-meta">
        建立時間：
        ${order.createdAt
          ? new Date(order.createdAt).toLocaleString("zh-TW")
          : "—"}
      </p>
      <ul class="order-items">${itemsHtml || "<li>（無品項）</li>"}</ul>
    `;

    list.appendChild(div);
  });
}
</script>

<script type="module">
import { renderSidebar } from "./components/sidebar.js";

document.getElementById("sidebar").innerHTML =
  renderSidebar();
</script>

</body>
</html>
