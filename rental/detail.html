<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>服裝詳情 · 舞韻租借</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../brand.css" />
  <link rel="stylesheet" href="rental.css" />
</head>
<body class="rental-app">
  <div class="stage-bg" aria-hidden="true">
    <div class="neon-grid"></div>
    <div class="spotlight spotlight-main"></div>
    <div class="stage-vignette"></div>
  </div>

  <header class="rental-header" id="rentalHeader"></header>
  <nav class="rental-steps" id="rentalSteps"></nav>

  <main class="rental-main" id="detailMain">
    <a href="costumes.html" class="back-link">← 返回列表</a>
    <div id="detailContent"></div>
  </main>

  <div class="rental-bar" id="detailBar" hidden>
    <button type="button" class="rental-btn rental-btn-ghost" id="btnAddCart">加入購物車</button>
    <a href="cart.html" class="rental-btn rental-btn-primary">查看購物車</a>
  </div>

  <script type="module">
    import { getCostumeById } from "./data.js";
    import { addToCart } from "../data/cart.js";
    import {
      getRemainingStock,
      getStockLevel,
      LOW_STOCK_THRESHOLD
    } from "../data/stock-service.js";
    import {
      renderShell, requireDate,
      getRentalContext, formatMoney
    } from "./common.js";

    if (!requireDate()) throw new Error("redirect");

    const id = new URLSearchParams(location.search).get("id");
    const costume = getCostumeById(id);

    if (!costume) {
      document.getElementById("detailContent").innerHTML = `
        <div class="rental-empty"><p>找不到此款服裝</p>
        <a href="costumes.html" class="rental-btn rental-btn-primary">返回列表</a></div>`;
      throw new Error("not found");
    }

    document.title = `${costume.name} · 舞韻租借`;

    renderShell({
      step: 2,
      title: costume.name,
      subtitle: costume.tagline,
      showCart: true
    });

    const ctx = getRentalContext();
    let selectedSize = costume.sizes[0];
    let quantity = 1;

    const root = document.getElementById("detailContent");
    const bar = document.getElementById("detailBar");
    bar.hidden = false;

    function getStockSnapshot(size) {
      return getRemainingStock({
        costumeId: costume.id,
        size,
        performanceDate: ctx.performanceDate,
        nDays: ctx.nDays
      });
    }

    function clampQuantity(q, size) {
      const max = getStockSnapshot(size).remaining;
      if (max <= 0) return 0;
      return Math.min(Math.max(1, q), max);
    }

    function stockHintHtml(snap) {
      const badge = `<span class="stock-badge stock-${snap.level}">${snap.label}</span>`;
      if (snap.remaining <= 0) {
        return `<p class="rental-hint stock-hint">剩餘 <strong>0</strong> 件 · 此尺寸暫不可租 ${badge}</p>`;
      }
      let html = `<p class="rental-hint stock-hint">剩餘可租 <strong>${snap.remaining}</strong> 件`;
      html += ` <span class="stock-meta">（原始 ${snap.totalStock} · 已租 ${snap.rented}）</span> ${badge}`;
      if (snap.remaining <= LOW_STOCK_THRESHOLD) {
        html += `<p class="stock-alert-low">⚠ 低庫存警示：建議盡早下訂</p>`;
      }
      html += `</p>`;
      return html;
    }

    function render() {
      quantity = clampQuantity(quantity, selectedSize);
      const snap = getStockSnapshot(selectedSize);
      const atMax = quantity >= snap.remaining && snap.remaining > 0;
      const outOfStock = snap.remaining <= 0;

      root.innerHTML = `
        <div class="detail-layout">
          <div class="detail-hero-visual ${costume.hue}">${costume.emoji}</div>
          <div>
            <div class="rental-card" style="margin-bottom:16px">
              <span class="costume-card-cat">${costume.category}</span>
              <p style="margin:12px 0;color:var(--text-soft);line-height:1.7">${costume.description}</p>
              <div class="tag-list">
                ${costume.highlights.map(h => `<span class="tag">${h}</span>`).join("")}
              </div>
            </div>
            <div class="rental-card">
              <p class="rental-hint" style="margin-bottom:12px">檔期：${ctx.performanceDate} 前後 ${ctx.nDays} 天內計入已租數量</p>
              <div class="rental-field">
                <label>選擇尺寸</label>
                <div class="size-picker" id="sizePicker">
                  ${costume.sizes.map(s => {
                    const sSnap = getStockSnapshot(s);
                    const disabled = sSnap.remaining <= 0;
                    return `
                    <button type="button" class="size-opt ${s === selectedSize ? "active" : ""}${disabled ? " size-opt--out" : ""}"
                      data-size="${s}" ${disabled ? "disabled" : ""}>
                      ${s}
                      <small class="size-opt-stock">${disabled ? "無" : sSnap.remaining}</small>
                    </button>`;
                  }).join("")}
                </div>
                ${stockHintHtml(snap)}
              </div>
              <div class="rental-field">
                <label>數量</label>
                <div class="qty-row">
                  <button type="button" class="qty-btn" id="qtyMinus" ${outOfStock ? "disabled" : ""}>−</button>
                  <span class="qty-val" id="qtyVal">${quantity}</span>
                  <button type="button" class="qty-btn" id="qtyPlus"${atMax || outOfStock ? " disabled" : ""}>+</button>
                </div>
              </div>
              <p style="font-size:1.1rem;font-weight:600;color:var(--tiffany-bright)">
                ${formatMoney(costume.pricePerDay * quantity)} <small style="color:var(--text-muted);font-weight:400">/ 計價單位</small>
              </p>
              <p class="rental-hint" style="margin-top:8px">含配件：${costume.accessories.join("、")}</p>
            </div>
          </div>
        </div>
      `;

      const addBtn = document.getElementById("btnAddCart");
      addBtn.disabled = outOfStock;
      addBtn.style.opacity = outOfStock ? "0.45" : "1";

      document.querySelectorAll(".size-opt:not(:disabled)").forEach(btn => {
        btn.addEventListener("click", () => {
          selectedSize = btn.dataset.size;
          quantity = clampQuantity(quantity, selectedSize);
          render();
        });
      });
      document.getElementById("qtyMinus").onclick = () => {
        quantity = Math.max(1, quantity - 1);
        render();
      };
      document.getElementById("qtyPlus").onclick = () => {
        quantity = clampQuantity(quantity + 1, selectedSize);
        render();
      };
    }

    render();

    function handleAddToCart() {
      quantity = clampQuantity(quantity, selectedSize);
      const snap = getStockSnapshot(selectedSize);

      if (snap.remaining <= 0 || quantity < 1 || quantity > snap.remaining) {
        alert(
          snap.remaining <= 0
            ? "此尺寸剩餘可租為 0，請選擇其他尺寸或日期"
            : `此尺寸剩餘可租 ${snap.remaining} 件，請調整數量`
        );
        render();
        return;
      }

      const item = {
        productId: costume.id,
        productName: costume.name,
        size: selectedSize,
        quantity,
        performanceDate: ctx.performanceDate
      };

      try {
        addToCart(item, { maxQuantity: snap.remaining });
      } catch {
        alert(`此尺寸剩餘可租 ${snap.remaining} 件，請調整數量`);
        render();
        return;
      }
      alert("已加入購物車");
    }

    document.getElementById("btnAddCart").addEventListener("click", handleAddToCart);
  </script>
</body>
</html>
