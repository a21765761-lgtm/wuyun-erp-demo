<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>確認訂單 · 舞韻</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="brand.css" />
  <link rel="stylesheet" href="styles/erp-layout.css" />
</head>
<body class="erp-body checkout-page">
  <div id="erp-stage" aria-hidden="true"></div>
  <div class="sidebar-overlay" id="erpSidebarOverlay"></div>
  <div class="app">
    <div id="erp-sidebar"></div>
    <main class="main">
      <header class="header erp-page-header">
        <div class="header-left">
          <button class="menu-toggle" id="erpMenuToggle" type="button" aria-label="選單">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
          </button>
          <div>
            <div class="greeting">確認 <span>訂單</span></div>
          </div>
        </div>
      </header>

      <div class="content checkout-content">
        <div class="page-head">
          <div>
            <h1 class="page-title">確認訂單</h1>
            <p class="page-desc">填寫客戶資料並送出租借申請</p>
          </div>
        </div>

        <article class="erp-card">
          <h2 class="section-title ship">客戶資料</h2>
          <div class="erp-field">
            <label for="orgName">單位名稱</label>
            <input type="text" id="orgName" placeholder="請輸入單位名稱" />
          </div>
          <div class="erp-field">
            <label for="contactName">聯絡人</label>
            <input type="text" id="contactName" placeholder="請輸入聯絡人" />
          </div>
          <div class="erp-field">
            <label for="phone">聯絡電話</label>
            <input type="tel" id="phone" placeholder="請輸入聯絡電話" />
          </div>
          <div class="erp-field">
            <label for="lineId">LINE ID（選填）</label>
            <input type="text" id="lineId" placeholder="請輸入 LINE ID" />
          </div>
          <div class="erp-field">
            <label for="email">Email（選填）</label>
            <input type="email" id="email" placeholder="請輸入 Email" />
          </div>
          <div class="erp-field">
            <label for="address">寄送地址</label>
            <textarea id="address" rows="3" placeholder="請輸入寄送地址"></textarea>
          </div>
          <div class="erp-field">
            <label for="notes">特殊需求（選填）</label>
            <textarea id="notes" rows="3" placeholder="例如急件、特殊尺寸等"></textarea>
          </div>
        </article>

        <article class="erp-card">
          <h2 class="section-title ship">訂單內容</h2>
          <div class="checkout-table-wrap">
            <table class="checkout-table">
              <thead>
                <tr>
                  <th>品項</th>
                  <th>尺寸</th>
                  <th>數量</th>
                  <th>小計</th>
                </tr>
              </thead>
              <tbody id="order-list"></tbody>
            </table>
          </div>
          <div class="checkout-total" id="total-price">總金額：$0</div>
        </article>

        <article class="erp-card">
          <h2 class="section-title ship">租借注意事項</h2>
          <div class="checkout-notice">
            <p>1. 表演結束後請立即清點所有服裝與配件。</p>
            <p>2. 請確認頭飾、腰帶、披肩、飾品、配件袋皆已完整回收。</p>
            <p>3. 若有缺件請立即聯繫舞韻。</p>
            <p>4. 若歸還後才發現缺件，需重新聯繫、補寄，將增加雙方作業時間。</p>
            <p>5. 部分特殊配件若遺失，可能需酌收賠償費用。</p>
          </div>
          <label class="checkout-agree">
            <input type="checkbox" id="agree" />
            <span>我已閱讀並同意租借規範</span>
          </label>
          <button type="button" class="btn btn-primary checkout-submit" id="submitBtn">確認送出訂單</button>
        </article>
      </div>
    </main>
  </div>

  <script type="module">
    import { getCart } from "./data/cart.js";
    import { mountErpShell } from "./components/erp-app.js";

    mountErpShell("");

    const cart = getCart();
    const orderList = document.getElementById("order-list");
    const totalEl = document.getElementById("total-price");
    const submitBtn = document.getElementById("submitBtn");

    let total = 0;

    if (cart.length === 0) {
      orderList.innerHTML = `
        <tr>
          <td colspan="4" class="empty-msg">
            購物車是空的，請先至 <a href="rental/">租借流程</a> 選擇服裝。
          </td>
        </tr>
      `;
      submitBtn.disabled = true;
      submitBtn.style.opacity = "0.5";
    } else {
      cart.forEach(item => {
        const subtotal = item.quantity * 1000;
        total += subtotal;
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${item.productName || "—"}</td>
          <td>${item.size || "—"}</td>
          <td>${item.quantity}</td>
          <td>$${subtotal.toLocaleString()}</td>
        `;
        orderList.appendChild(tr);
      });
    }

    totalEl.textContent = `總金額：$${total.toLocaleString()}`;

    document.getElementById("submitBtn").addEventListener("click", () => {
      if (cart.length === 0) return;

      if (!document.getElementById("agree").checked) {
        alert("請先同意租借規範");
        return;
      }

      const orgName = document.getElementById("orgName").value.trim();
      const contactName = document.getElementById("contactName").value.trim();
      const phone = document.getElementById("phone").value.trim();
      const address = document.getElementById("address").value.trim();

      if (!orgName || !contactName || !phone || !address) {
        alert("請填寫單位名稱、聯絡人、聯絡電話與寄送地址");
        return;
      }

      const order = {
        id: Date.now(),
        orgName,
        contactName,
        phone,
        lineId: document.getElementById("lineId").value.trim(),
        email: document.getElementById("email").value.trim(),
        address,
        notes: document.getElementById("notes").value.trim(),
        createdAt: new Date().toISOString(),
        status: "待確認",
        items: [...cart]
      };

      const activeOrders = JSON.parse(localStorage.getItem("activeOrders") || "[]");
      activeOrders.push(order);
      localStorage.setItem("activeOrders", JSON.stringify(activeOrders));
      localStorage.removeItem("cart");
      sessionStorage.setItem("lastOrderId", String(order.id));
      window.location.href = "order-success.html";
    });
  </script>
</body>
</html>
