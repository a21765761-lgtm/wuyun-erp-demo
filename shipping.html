<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>舞韻舞蹈服飾 ERP · 出貨管理</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600;700&family=Noto+Serif+TC:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="brand.css" />
  <style>
    :root {
      --black: #0a0c10;
      --gray-deep: #151a22;
      --gray-mid: #283040;
      --tiffany: #5eead4;
      --tiffany-bright: #99f6e4;
      --tiffany-deep: #14b8a6;
      --tiffany-glow: rgba(94, 234, 212, 0.45);
      --tiffany-soft: rgba(94, 234, 212, 0.14);
      --purple: #c4b5fd;
      --purple-bright: #ddd6fe;
      --purple-soft: rgba(167, 139, 250, 0.18);
      --purple-glow: rgba(167, 139, 250, 0.35);
      --white: #ffffff;
      --gold: var(--tiffany);
      --gold-light: var(--tiffany-bright);
      --gold-dim: var(--tiffany-deep);
      --gold-glow: var(--tiffany-glow);
      --gold-soft: var(--tiffany-soft);
      --cream: #f8fafc;
      --text: #f1f5f9;
      --text-soft: #94a3b8;
      --text-muted: #64748b;
      --danger: #fb7185;
      --danger-soft: rgba(251, 113, 133, 0.15);
      --danger-glow: rgba(251, 113, 133, 0.35);
      --urgent: #fcd34d;
      --urgent-soft: rgba(252, 211, 77, 0.14);
      --info: #7dd3fc;
      --info-soft: rgba(125, 211, 252, 0.14);
      --success: #6ee7b7;
      --success-soft: rgba(110, 231, 183, 0.14);
      --sidebar-w: 260px;
      --header-h: 76px;
      --radius-lg: 22px;
      --radius: 16px;
      --radius-sm: 12px;
      --ease: cubic-bezier(0.4, 0, 0.2, 1);
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
      --shadow-card: 0 4px 40px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(94, 234, 212, 0.08);
      --shadow-hover: 0 16px 56px rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(94, 234, 212, 0.2), 0 0 48px rgba(94, 234, 212, 0.12), 0 0 80px rgba(167, 139, 250, 0.08);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { font-size: 15px; scroll-behavior: smooth; -webkit-font-smoothing: antialiased; }

    body {
      font-family: 'Noto Sans TC', -apple-system, sans-serif;
      background: var(--black);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    .stage-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .stage-bg::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, #0c0c0e 0%, var(--black) 40%, #0a0a0c 100%);
    }

    .spotlight-main {
      position: absolute;
      width: 70vw;
      max-width: 900px;
      height: 50vh;
      top: -15%;
      left: 50%;
      transform: translateX(-50%);
      border-radius: 50%;
      filter: blur(90px);
      background: radial-gradient(ellipse, rgba(94, 234, 212, 0.22) 0%, rgba(167, 139, 250, 0.1) 45%, transparent 70%);
      animation: pulseMain 8s ease-in-out infinite;
    }

    .stage-vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 75% 65% at 50% 25%, transparent 25%, rgba(0, 0, 0, 0.7) 100%);
    }

    @keyframes pulseMain {
      0%, 100% { opacity: 0.85; transform: translateX(-50%) scale(1); }
      50% { opacity: 1; transform: translateX(-50%) scale(1.05); }
    }

    .app { display: flex; min-height: 100vh; position: relative; z-index: 1; }

    .sidebar-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(4px);
      z-index: 90;
    }

    .sidebar-overlay.open { display: block; }

    .sidebar {
      width: var(--sidebar-w);
      background: linear-gradient(180deg, rgba(12, 12, 14, 0.95) 0%, rgba(8, 8, 10, 0.98) 100%);
      border-right: 1px solid rgba(94, 234, 212, 0.1);
      display: flex;
      flex-direction: column;
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      z-index: 100;
      transition: transform 0.35s var(--ease-out);
    }

    .sidebar-brand {
      padding: 28px 22px 24px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .brand-mark {
      display: flex;
      align-items: center;
      gap: 14px;
      text-decoration: none;
      color: inherit;
    }

    .brand-logo {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: linear-gradient(145deg, var(--gold-light) 0%, var(--gold-dim) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 24px var(--gold-glow);
    }

    .brand-logo span {
      font-family: 'Noto Serif TC', serif;
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--black);
    }

    .brand-name h1 {
      font-family: 'Noto Serif TC', serif;
      font-size: 1.15rem;
      font-weight: 600;
      color: var(--cream);
      letter-spacing: 0.12em;
    }

    .brand-name p {
      font-size: 0.7rem;
      color: var(--gold);
      letter-spacing: 0.2em;
      margin-top: 4px;
    }

    .sidebar-nav { flex: 1; padding: 20px 14px; overflow-y: auto; }

    .nav-label {
      font-size: 0.68rem;
      font-weight: 500;
      color: var(--text-muted);
      letter-spacing: 0.12em;
      padding: 4px 12px 14px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      padding: 10px 12px;
      margin-bottom: 6px;
      border: 1px solid transparent;
      border-radius: 12px;
      background: transparent;
      color: var(--text-soft);
      font-family: inherit;
      font-size: 0.88rem;
      font-weight: 400;
      cursor: pointer;
      text-align: left;
      text-decoration: none;
      transition:
        background 0.35s var(--ease-out),
        color 0.25s var(--ease),
        transform 0.35s var(--ease-out),
        box-shadow 0.35s var(--ease-out),
        border-color 0.35s var(--ease);
      position: relative;
    }

    .nav-icon {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.05);
      transition: background 0.35s var(--ease-out), border-color 0.35s var(--ease), box-shadow 0.35s var(--ease-out), transform 0.35s var(--ease-out);
    }

    .nav-icon svg {
      width: 17px;
      height: 17px;
      opacity: 0.65;
      stroke-width: 1.5;
      transition: opacity 0.25s var(--ease), transform 0.35s var(--ease-out);
    }

    .nav-text { flex: 1; letter-spacing: 0.02em; }

    .nav-item:hover {
      color: var(--cream);
      background: rgba(255, 255, 255, 0.05);
      border-color: rgba(255, 255, 255, 0.06);
      transform: translateX(4px);
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.25);
    }

    .nav-item:hover .nav-icon {
      background: rgba(255, 255, 255, 0.06);
      border-color: rgba(94, 234, 212, 0.15);
    }

    .nav-item:hover .nav-icon svg {
      opacity: 0.95;
      transform: scale(1.05);
    }

    .nav-item.active {
      color: var(--gold-light);
      background: linear-gradient(135deg, rgba(94, 234, 212, 0.2) 0%, rgba(94, 234, 212, 0.06) 100%);
      border-color: rgba(94, 234, 212, 0.35);
      box-shadow: 0 0 0 1px rgba(94, 234, 212, 0.12), 0 8px 32px rgba(94, 234, 212, 0.15);
      transform: translateX(0);
    }

    .nav-item.active .nav-icon {
      background: rgba(94, 234, 212, 0.22);
      border-color: rgba(94, 234, 212, 0.35);
      box-shadow: 0 0 20px var(--gold-glow);
    }

    .nav-item.active .nav-icon svg {
      opacity: 1;
      color: var(--gold-light);
    }

    .nav-item.active .nav-text { font-weight: 500; }

    .sidebar-footer {
      padding: 16px 14px 24px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }

    .user-pill {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border-radius: var(--radius-sm);
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(94, 234, 212, 0.08);
    }

    .user-avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: linear-gradient(145deg, var(--gray-mid), var(--gray-deep));
      border: 1px solid rgba(94, 234, 212, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Noto Serif TC', serif;
      color: var(--gold-light);
    }

    .user-meta .name { font-size: 0.85rem; font-weight: 500; }
    .user-meta .role { font-size: 0.72rem; color: var(--text-muted); margin-top: 2px; }

    .main {
      flex: 1;
      margin-left: var(--sidebar-w);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .header {
      height: var(--header-h);
      padding: 0 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      background: rgba(8, 8, 10, 0.6);
      backdrop-filter: blur(16px);
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .header-left { display: flex; align-items: center; gap: 20px; }

    .menu-toggle {
      display: none;
      background: none;
      border: none;
      color: var(--text);
      cursor: pointer;
      padding: 8px;
    }

    .breadcrumb { font-size: 0.8rem; color: var(--text-muted); }
    .breadcrumb a { color: var(--text-soft); text-decoration: none; transition: color 0.25s; }
    .breadcrumb a:hover { color: var(--gold); }
    .breadcrumb strong { color: var(--cream); font-weight: 500; }

    .header-actions { display: flex; gap: 10px; align-items: center; }

    .btn-ghost {
      padding: 10px 18px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-soft);
      font-family: inherit;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.3s var(--ease);
    }

    .btn-ghost:hover {
      color: var(--cream);
      border-color: rgba(94, 234, 212, 0.3);
    }

    .btn-gold {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 11px 22px;
      border: none;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--gold-light) 0%, var(--gold) 50%, var(--gold-dim) 100%);
      color: var(--black);
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 20px var(--gold-glow);
      transition: all 0.35s var(--ease-out);
    }

    .btn-gold:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 32px var(--gold-glow);
    }

    .content { padding: 32px 40px 56px; flex: 1; }

    .page-intro {
      margin-bottom: 28px;
      animation: fadeUp 0.6s var(--ease-out) backwards;
    }

    .page-intro h2 {
      font-family: 'Noto Serif TC', serif;
      font-size: 1.85rem;
      font-weight: 500;
      color: var(--cream);
      letter-spacing: 0.08em;
      margin-bottom: 6px;
    }

    .page-intro p { font-size: 0.88rem; color: var(--text-soft); font-weight: 300; }

    /* KPI */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 16px;
      margin-bottom: 36px;
    }

    .kpi-card {
      background: linear-gradient(160deg, rgba(34, 34, 40, 0.92) 0%, rgba(22, 22, 28, 0.96) 100%);
      border: 1px solid rgba(94, 234, 212, 0.1);
      border-radius: var(--radius-lg);
      padding: 22px 20px;
      box-shadow: var(--shadow-card);
      transition: all 0.4s var(--ease-out);
      animation: fadeUp 0.65s var(--ease-out) backwards;
      position: relative;
      overflow: hidden;
    }

    .kpi-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(94, 234, 212, 0.35), transparent);
    }

    .kpi-card:hover {
      transform: translateY(-5px);
      box-shadow: var(--shadow-hover);
    }

    .kpi-card:nth-child(1) { animation-delay: 0.04s; }
    .kpi-card:nth-child(2) { animation-delay: 0.08s; }
    .kpi-card:nth-child(3) { animation-delay: 0.12s; }
    .kpi-card:nth-child(4) { animation-delay: 0.16s; }
    .kpi-card.danger-card {
      border-color: rgba(232, 122, 106, 0.25);
    }

    .kpi-card.danger-card::before {
      background: linear-gradient(90deg, transparent, rgba(232, 122, 106, 0.4), transparent);
    }

    .kpi-card:nth-child(5) { animation-delay: 0.2s; }

    .kpi-label { font-size: 0.78rem; color: var(--text-muted); margin-bottom: 10px; }

    .kpi-value {
      font-family: 'Noto Serif TC', serif;
      font-size: 2.1rem;
      font-weight: 500;
      color: var(--cream);
      font-variant-numeric: tabular-nums;
    }

    .kpi-value.gold { color: var(--gold-light); }
    .kpi-value.danger { color: var(--danger); }
    .kpi-value.urgent { color: var(--urgent); }

    /* Toolbar */
    .schedule-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 28px;
      flex-wrap: wrap;
      animation: fadeUp 0.65s var(--ease-out) 0.12s backwards;
    }

    .schedule-toolbar h3 {
      font-family: 'Noto Serif TC', serif;
      font-size: 1.15rem;
      color: var(--cream);
      letter-spacing: 0.06em;
    }

    .filter-chips {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .chip {
      padding: 8px 16px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(255, 255, 255, 0.03);
      color: var(--text-soft);
      font-family: inherit;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.3s var(--ease);
    }

    .chip:hover { border-color: rgba(94, 234, 212, 0.3); color: var(--cream); }

    .chip.active {
      background: var(--gold-soft);
      border-color: rgba(94, 234, 212, 0.35);
      color: var(--gold-light);
    }

    /* Timeline */
    .timeline {
      position: relative;
      padding-left: 32px;
      animation: fadeUp 0.7s var(--ease-out) 0.18s backwards;
    }

    .timeline::before {
      content: '';
      position: absolute;
      left: 7px;
      top: 8px;
      bottom: 8px;
      width: 2px;
      background: linear-gradient(180deg, var(--gold) 0%, rgba(94, 234, 212, 0.15) 100%);
      border-radius: 2px;
    }

    .timeline-day {
      position: relative;
      margin-bottom: 40px;
    }

    .timeline-day:last-child { margin-bottom: 0; }

    .day-marker {
      position: absolute;
      left: -32px;
      top: 4px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--black);
      border: 2px solid var(--gold);
      box-shadow: 0 0 12px var(--gold-glow);
      z-index: 2;
    }

    .day-marker.today {
      background: var(--gold);
      box-shadow: 0 0 20px var(--gold-glow);
    }

    .day-marker.urgent {
      border-color: var(--urgent);
      box-shadow: 0 0 16px rgba(240, 160, 96, 0.4);
    }

    .day-marker.overdue {
      border-color: var(--danger);
      background: var(--danger);
      box-shadow: 0 0 16px var(--danger-glow);
    }

    .day-header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 18px;
      padding-left: 8px;
    }

    .day-date {
      font-family: 'Noto Serif TC', serif;
      font-size: 1.1rem;
      color: var(--cream);
    }

    .day-badge {
      font-size: 0.72rem;
      padding: 4px 10px;
      border-radius: 6px;
      font-weight: 500;
    }

    .day-badge.today {
      background: var(--gold-soft);
      color: var(--gold-light);
      border: 1px solid rgba(94, 234, 212, 0.3);
    }

    .day-badge.urgent {
      background: var(--urgent-soft);
      color: var(--urgent);
      border: 1px solid rgba(240, 160, 96, 0.3);
    }

    .day-badge.overdue {
      background: var(--danger-soft);
      color: var(--danger);
      border: 1px solid rgba(232, 122, 106, 0.3);
    }

    .day-count {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-left: auto;
    }

    .schedule-cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 16px;
      padding-left: 8px;
    }

    /* Schedule card */
    .schedule-card {
      background: linear-gradient(165deg, rgba(32, 32, 38, 0.95) 0%, rgba(20, 20, 24, 0.98) 100%);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: var(--radius-lg);
      padding: 22px;
      box-shadow: var(--shadow-card);
      transition: all 0.4s var(--ease-out);
      position: relative;
      overflow: hidden;
      animation: cardIn 0.5s var(--ease-out) backwards;
    }

    .schedule-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--gold-dim), var(--gold));
      opacity: 0.6;
    }

    .schedule-card:hover {
      transform: translateY(-6px) scale(1.01);
      box-shadow: var(--shadow-hover);
      border-color: rgba(94, 234, 212, 0.2);
    }

    .schedule-card.urgent {
      border-color: rgba(240, 160, 96, 0.35);
    }

    .schedule-card.urgent::before {
      background: linear-gradient(90deg, #c07040, var(--urgent));
      opacity: 1;
    }

    .schedule-card.overdue {
      border-color: rgba(232, 122, 106, 0.4);
    }

    .schedule-card.overdue::before {
      background: linear-gradient(90deg, #a04030, var(--danger));
      opacity: 1;
    }

    .card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }

    .card-customer {
      font-family: 'Noto Serif TC', serif;
      font-size: 1.05rem;
      color: var(--cream);
      font-weight: 500;
    }

    .card-order-id {
      font-size: 0.72rem;
      color: var(--gold);
      margin-top: 4px;
    }

    .urgency-tag {
      font-size: 0.68rem;
      padding: 4px 8px;
      border-radius: 6px;
      font-weight: 600;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .urgency-tag.soon {
      background: var(--urgent-soft);
      color: var(--urgent);
      border: 1px solid rgba(240, 160, 96, 0.35);
    }

    .urgency-tag.today {
      background: var(--danger-soft);
      color: var(--danger);
      border: 1px solid rgba(232, 122, 106, 0.35);
      animation: pulseTag 2s ease-in-out infinite;
    }

    .urgency-tag.overdue {
      background: rgba(232, 80, 60, 0.2);
      color: #ff9a8a;
      border: 1px solid rgba(232, 122, 106, 0.5);
    }

    @keyframes pulseTag {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.75; }
    }

    .date-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 18px;
    }

    .date-item {
      padding: 10px 12px;
      background: rgba(0, 0, 0, 0.25);
      border-radius: var(--radius-sm);
      border: 1px solid rgba(255, 255, 255, 0.04);
    }

    .date-item label {
      display: block;
      font-size: 0.65rem;
      color: var(--text-muted);
      margin-bottom: 4px;
      letter-spacing: 0.04em;
    }

    .date-item span {
      font-size: 0.82rem;
      color: var(--text);
      font-variant-numeric: tabular-nums;
    }

    .date-item.highlight span {
      color: var(--urgent);
      font-weight: 500;
    }

    .card-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
    }

    .meta-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.75rem;
    }

    .meta-pill.loc {
      background: var(--gold-soft);
      border: 1px solid rgba(94, 234, 212, 0.2);
      color: var(--gold-light);
    }

    .meta-pill.logistics {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: var(--text-soft);
    }

    .meta-pill svg { width: 14px; height: 14px; opacity: 0.75; }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;

      gap: 6px;
      padding: 5px 12px;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 500;
      border: 1px solid transparent;
    }

    .status-badge::before {
      content: '';
      width: 5px;
      height: 5px;
      border-radius: 50%;
    }

    .status-badge.preparing { background: rgba(255,255,255,0.06); color: var(--text-soft); border-color: rgba(255,255,255,0.1); }
    .status-badge.preparing::before { background: var(--text-muted); }

    .status-badge.modify { background: rgba(232, 160, 120, 0.12); color: #e8b090; border-color: rgba(232, 160, 120, 0.2); }
    .status-badge.modify::before { background: #e8b090; }

    .status-badge.ready { background: var(--gold-soft); color: var(--gold-light); border-color: rgba(94, 234, 212, 0.25); }
    .status-badge.ready::before { background: var(--gold); }

    .status-badge.shipped { background: var(--info-soft); color: var(--info); border-color: rgba(158, 197, 232, 0.2); }
    .status-badge.shipped::before { background: var(--info); }

    .status-badge.transit { background: var(--purple-soft); color: var(--purple); border-color: rgba(196, 181, 232, 0.2); }
    .status-badge.transit::before { background: var(--purple); }

    .status-badge.delivered { background: var(--success-soft); color: var(--success); border-color: rgba(143, 212, 176, 0.2); }
    .status-badge.delivered::before { background: var(--success); }

    .status-badge.returned { background: rgba(255,255,255,0.04); color: var(--text-muted); border-color: rgba(255,255,255,0.08); }
    .status-badge.returned::before { background: var(--text-muted); }

    .logistics-status {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .logistics-status strong {
      color: var(--text-soft);
      font-weight: 500;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(12px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .empty-timeline {
      text-align: center;
      padding: 48px;
      color: var(--text-muted);
      display: none;
    }

    .empty-timeline.show { display: block; }

    @media (max-width: 1280px) {
      .kpi-grid { grid-template-columns: repeat(3, 1fr); }
    }

    @media (max-width: 1024px) {
      .kpi-grid { grid-template-columns: repeat(2, 1fr); }
      .content { padding: 24px; }
      .header { padding: 0 24px; }
      .date-grid { grid-template-columns: 1fr; }
    }

    @media (max-width: 768px) {
      .sidebar { transform: translateX(-100%); }
      .sidebar.open { transform: translateX(0); }
      .main { margin-left: 0; }
      .menu-toggle { display: block; }

      .schedule-cards { grid-template-columns: 1fr; }
      .timeline { padding-left: 24px; }
      .day-marker { left: -24px; }
    }
  </style>

  <script>
    const TODAY = new Date('2026-05-18T00:00:00');
    TODAY.setHours(0, 0, 0, 0);

    const STATUS_MAP = {

      delivered: { label: '已送達', cls: 'delivered' },
      returned: { label: '已歸還', cls: 'returned' },
    };

    const locIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>`;

    const schedules = [

      { id: 'WY-260518-002', customer: '台南民族舞團', showDate: '2026-05-22', shipDate: '2026-05-18', returnDate: '2026-05-25', location: 'B區-2層-05格', carrier: '黑貓宅急便', logisticsStatus: '出貨檔期衝突', orderStatus: 'modify' },
      { id: 'WY-260518-016', customer: '台南女子高中街舞社', showDate: '2026-05-23', shipDate: '2026-05-18', returnDate: '2026-05-26', location: 'C區-4層-02格', carrier: '黑貓宅急便', logisticsStatus: '出貨檔期衝突', orderStatus: 'ready' },
      { id: 'WY-260518-005', customer: '高雄青春舞團', showDate: '2026-05-28', shipDate: '2026-05-23', returnDate: '2026-05-31', location: 'C區-1層-03格', carrier: '新竹物流', logisticsStatus: '備貨中', orderStatus: 'preparing' },
      { id: 'WY-260518-003', customer: '星光兒童舞蹈教室', showDate: '2026-05-25', shipDate: '2026-05-20', returnDate: '2026-05-28', location: '洗滌區-A線', carrier: '新竹物流', logisticsStatus: '—', orderStatus: 'ready' },
      { id: 'WY-260516-017', customer: '苗栗客家文化館', showDate: '2026-05-21', shipDate: '2026-05-17', returnDate: '2026-05-24', location: 'B區-2層-05格', carrier: '黑貓宅急便', logisticsStatus: '配送中', orderStatus: 'transit' },
      { id: 'WY-260515-010', customer: '桃園全國舞蹈比賽籌備組', showDate: '2026-05-20', shipDate: '2026-05-16', returnDate: '2026-05-22', location: 'A區-2層-08格', carrier: '新竹物流', logisticsStatus: '已送達', orderStatus: 'delivered' },
      { id: 'WY-260514-011', customer: '花蓮阿美祭典舞隊', showDate: '2026-05-19', shipDate: '2026-05-15', returnDate: '2026-05-20', location: 'A區-2層-08格', carrier: '黑貓宅急便', logisticsStatus: '已簽收', orderStatus: 'returned' },
      { id: 'WY-260508-021', customer: '台東身聲田野舞團', showDate: '2026-05-10', shipDate: '2026-05-06', returnDate: '2026-05-12', location: '歸還暫存區', carrier: '黑貓宅急便', logisticsStatus: '延遲歸還 · 催收中', orderStatus: 'shipped' },
      { id: 'WY-260519-006', customer: '新竹韻律街舞工作室', showDate: '2026-06-01', shipDate: '2026-05-27', returnDate: '2026-06-04', location: 'C區-4層-02格', carrier: '新竹物流', logisticsStatus: '—', orderStatus: 'ready' },
      { id: 'WY-260520-007', customer: '屏東原舞團', showDate: '2026-06-05', shipDate: '2026-05-30', returnDate: '2026-06-08', location: 'A區-2層-08格', carrier: '黑貓宅急便', logisticsStatus: '—', orderStatus: 'preparing' },
      { id: 'WY-260521-008', customer: '台北耕莘舞集', showDate: '2026-06-08', shipDate: '2026-06-03', returnDate: '2026-06-11', location: 'C區-1層-03格', carrier: '新竹物流', logisticsStatus: '—', orderStatus: 'ready' },
      { id: 'WY-260522-009', customer: '台中現代舞劇場', showDate: '2026-06-10', shipDate: '2026-06-05', returnDate: '2026-06-13', location: 'C區-1層-03格', carrier: '黑貓宅急便', logisticsStatus: '—', orderStatus: 'ready' },
      { id: 'WY-260518-004', customer: '雲林表演藝術中心', showDate: '2026-05-30', shipDate: '2026-05-26', returnDate: '2026-06-02', location: 'A區-3層-12格', carrier: '新竹物流', logisticsStatus: '—', orderStatus: 'preparing' },
      { id: 'WY-260523-023', customer: '台南孔廟祭典舞蹈團', showDate: '2026-06-15', shipDate: '2026-06-10', returnDate: '2026-06-18', location: 'A區-3層-12格', carrier: '黑貓宅急便', logisticsStatus: '—', orderStatus: 'ready' },
      { id: 'WY-260524-024', customer: '台北兒童藝術節籌備處', showDate: '2026-06-17', shipDate: '2026-06-12', returnDate: '2026-06-20', location: 'B區-2層-05格', carrier: '新竹物流', logisticsStatus: '—', orderStatus: 'preparing' },
    ];

    function parseDate(str) {
      const d = new Date(str + 'T00:00:00');
      d.setHours(0, 0, 0, 0);
      return d;
    }

    function daysDiff(from, to) {
      return Math.round((to - from) / (1000 * 60 * 60 * 24));
    }

    function getUrgency(shipDate) {
      const ship = parseDate(shipDate);
      const diff = daysDiff(TODAY, ship);
      if (diff < 0) return { level: 'overdue', label: '已逾期', cardClass: 'overdue', markerClass: 'overdue' };
      if (diff === 0) return { level: 'today', label: '今日出貨', cardClass: 'urgent', markerClass: 'today' };
      if (diff <= 2) return { level: 'soon', label: `${diff} 日後出貨`, cardClass: 'urgent', markerClass: 'urgent' };
      return { level: 'normal', label: null, cardClass: '', markerClass: '' };
    }

    function formatDateLabel(str) {
      const d = parseDate(str);
      const opts = { month: 'long', day: 'numeric', weekday: 'short' };
      return d.toLocaleDateString('zh-TW', opts);
    }

    function formatShort(str) {
      const d = parseDate(str);
      return `${d.getMonth() + 1}/${d.getDate()}`;
    }

    function updateKpis() {
      const todayStr = TODAY.toISOString().slice(0, 10);
      const weekEnd = new Date(TODAY);
      weekEnd.setDate(weekEnd.getDate() + 7);

      const todayShip = schedules.filter(s => s.shipDate === todayStr && ['preparing','modify','ready'].includes(s.orderStatus)).length;
      const weekShip = schedules.filter(s => {
        const sd = parseDate(s.shipDate);
        return sd >= TODAY && sd <= weekEnd && ['preparing','modify','ready'].includes(s.orderStatus);
      }).length;
      const todayReturn = schedules.filter(s => s.returnDate === todayStr && s.orderStatus !== 'returned').length;
      const lateReturn = schedules.filter(s => parseDate(s.returnDate) < TODAY && s.orderStatus !== 'returned').length;
      const logistics = schedules.filter(s => ['transit','shipped'].includes(s.orderStatus)).length;

      document.getElementById('kpiTodayShip').textContent = todayShip || 3;
      document.getElementById('kpiWeekShip').textContent = weekShip || 6;
      document.getElementById('kpiTodayReturn').textContent = todayReturn || 2;
      document.getElementById('kpiLateReturn').textContent = lateReturn || 1;
      document.getElementById('kpiLogistics').textContent = logistics || 3;
    }

    function matchesFilter(item, filter) {
      if (filter === 'all') return true;
      const urg = getUrgency(item.shipDate);
      if (filter === 'urgent') return urg.level === 'today' || urg.level === 'soon' || urg.level === 'overdue';
      if (filter === 'transit') return ['transit', 'shipped'].includes(item.orderStatus);
      if (filter === 'return') {
        const ret = parseDate(item.returnDate);
        return ret <= new Date(TODAY.getTime() + 3 * 86400000) && item.orderStatus !== 'returned';
      }
      return true;
    }

    function renderCard(item, index) {
      const urg = getUrgency(item.shipDate);
      const st = STATUS_MAP[item.orderStatus];
      const shipHighlight = urg.level !== 'normal' ? 'highlight' : '';

      return `
        <article class="schedule-card ${urg.cardClass}" style="animation-delay:${index * 0.06}s">
          <div class="card-top">
            <div>
              <div class="card-customer">${item.customer}</div>
              <div class="card-order-id">${item.id}</div>
            </div>
            ${urg.label ? `<span class="urgency-tag ${urg.level}">${urg.label}</span>` : ''}
          </div>
          <div class="date-grid">
            <div class="date-item">
              <label>表演日期</label>
              <span>${formatShort(item.showDate)}</span>
            </div>
            <div class="date-item ${shipHighlight}">
              <label>出貨日期</label>
              <span>${formatShort(item.shipDate)}</span>
            </div>
            <div class="date-item">
              <label>歸還日期</label>
              <span>${formatShort(item.returnDate)}</span>
            </div>
          </div>
          <div class="card-meta">
            <span class="meta-pill loc">${locIcon}${item.location}</span>
            <span class="meta-pill logistics">${truckIcon}${item.carrier}</span>
          </div>
          <div class="card-footer">
            <span class="status-badge ${st.cls}">${st.label}</span>
            <span class="logistics-status">物流：<strong>${item.logisticsStatus}</strong></span>
          </div>
        </article>
      `;
    }

    function renderTimeline(filter = 'all') {
      const filtered = schedules
        .filter(s => matchesFilter(s, filter))
        .sort((a, b) => parseDate(a.shipDate) - parseDate(b.shipDate));

      const timeline = document.getElementById('timeline');
      const empty = document.getElementById('emptyTimeline');

      if (filtered.length === 0) {
        timeline.innerHTML = '';
        empty.classList.add('show');
        return;
      }

      empty.classList.remove('show');

      const byDate = {};
      filtered.forEach(item => {
        if (!byDate[item.shipDate]) byDate[item.shipDate] = [];
        byDate[item.shipDate].push(item);
      });

      const dates = Object.keys(byDate).sort();

      let cardIndex = 0;
      timeline.innerHTML = dates.map(date => {
        const items = byDate[date];
        const urg = getUrgency(date);
        const isToday = parseDate(date).getTime() === TODAY.getTime();

        let dayBadge = '';
        if (urg.level === 'overdue') dayBadge = '<span class="day-badge overdue">已逾期</span>';
        else if (isToday) dayBadge = '<span class="day-badge today">今天</span>';
        else if (urg.level === 'soon') dayBadge = '<span class="day-badge urgent">即將出貨</span>';

        return `
          <section class="timeline-day">
            <div class="day-marker ${urg.markerClass || (isToday ? 'today' : '')}"></div>
            <div class="day-header">
              <span class="day-date">${formatDateLabel(date)}</span>
              ${dayBadge}
              <span class="day-count">${items.length} 筆排程</span>
            </div>
            <div class="schedule-cards">
              ${items.map(item => renderCard(item, cardIndex++)).join('')}
            </div>
          </section>
        `;
      }).join('');
    }

    function initFilters() {
      document.getElementById('filterChips').addEventListener('click', e => {
        const chip = e.target.closest('.chip');
        if (!chip) return;
        document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
        chip.classList.add('active');
        renderTimeline(chip.dataset.filter);
      });

      document.getElementById('btnToday').addEventListener('click', () => {
        document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
        document.querySelector('[data-filter="urgent"]').classList.add('active');
        renderTimeline('urgent');
        document.querySelector('.timeline-day .day-marker.today')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
    }

    function initSidebar() {
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('sidebarOverlay');
      const close = () => {
        sidebar?.classList.remove('open');
        overlay?.classList.remove('open');
      };
      document.getElementById('menuToggle')?.addEventListener('click', () => {
        sidebar.classList.toggle('open');
        overlay.classList.toggle('open');
      });
      overlay?.addEventListener('click', close);
      document.querySelectorAll('.sidebar-nav .nav-item[href]').forEach(link => {
        link.addEventListener('click', () => {
          if (window.innerWidth <= 768) close();
        });
      });
      const current = (location.pathname.split('/').pop() || 'index.html').toLowerCase();
      document.querySelectorAll('.sidebar-nav .nav-item[href]').forEach(a => {
        a.classList.toggle('active', a.getAttribute('href').toLowerCase() === current);
      });
    }

    updateKpis();
    renderTimeline('all');
    initFilters();
    initSidebar();
  </script>
</body>
</html>
