<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>進行中訂單｜舞韻</title>
  <style>
    body {
      margin: 0;
      margin-left: 240px;
      padding: 40px;
      background: #0f172a;
      color: white;
      font-family: Arial, "Noto Sans TC", sans-serif;
    }

    .sidebar {
      position: fixed;
      left: 0;
      top: 0;
      width: 240px;
      height: 100vh;
      background: #111827;
      padding: 30px;
      box-sizing: border-box;
      z-index: 100;
    }

    .sidebar h2 {
      color: #2dd4bf;
      margin-bottom: 30px;
    }

    .sidebar a {
      display: block;
      color: white;
      text-decoration: none;
      margin-bottom: 20px;
    }

    .sidebar a:hover {
      color: #2dd4bf;
    }

    .container {
      max-width: 900px;
      margin: auto;
    }

    h1 {
      color: #2dd4bf;
      margin-bottom: 8px;
    }

    .nav {
      margin-bottom: 28px;
    }

    .nav a {
      color: #2dd4bf;
      text-decoration: none;
      margin-right: 16px;
    }

    .nav a:hover {
      text-decoration: underline;
    }

    #orders p {
      color: #94a3b8;
      padding: 24px 0;
    }

    .order-card {
      background: #1e293b;
      padding: 24px;
      border-radius: 16px;
      margin-bottom: 20px;
      border: 1px solid #334155;
    }

    .order-card h3 {
      margin: 0 0 8px;
      color: #2dd4bf;
    }

    .order-meta {
      font-size: 0.9rem;
      color: #cbd5e1;
      margin-bottom: 16px;
    }

    .status-select {
      margin-top: 12px;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid #334155;
      background: #334155;
      color: white;
      font-family: inherit;
      font-size: 0.95rem;
      min-width: 160px;
    }

    .order-items {
      margin: 0;
      padding-left: 20px;
      color: #e2e8f0;
      line-height: 1.8;
    }
  </style>
</head>
<body>

<div id="sidebar"></div>

<div class="container">
  <h1>進行中訂單</h1>
  <div id="orders"></div>
</div>

<script>
const orders = JSON.parse(
  localStorage.getItem("activeOrders")
) || [];

const ordersDiv = document.getElementById("orders");

if (orders.length === 0) {
  ordersDiv.innerHTML = "<p>目前沒有進行中訂單</p>";
} else {
  orders.forEach(order => {
    const card = document.createElement("div");
    card.className = "order-card";

    const created = order.createdAt
      ? new Date(order.createdAt).toLocaleString("zh-TW")
      : "—";

    const itemsHtml = (order.items || [])
      .map(item => {
        const name = item.productName || "品項";
        const size = item.size ? ` · ${item.size}` : "";
        const qty = item.quantity ?? 1;
        return `<li>${name}${size} × ${qty}</li>`;
      })
      .join("");

    const status = order.status || "待確認";

    card.innerHTML = `
      <h3>訂單 #${order.id}</h3>
      <p class="order-meta">建立時間：${created}</p>
      <select class="status-select" onchange="updateStatus('${order.id}', this.value)">
        <option value="待確認" ${status === "待確認" ? "selected" : ""}>待確認</option>
        <option value="待處理" ${status === "待處理" ? "selected" : ""}>待處理</option>
        <option value="已出貨" ${status === "已出貨" ? "selected" : ""}>已出貨</option>
        <option value="已歸還" ${status === "已歸還" ? "selected" : ""}>已歸還</option>
        <option value="完成" ${status === "完成" ? "selected" : ""}>完成</option>
      </select>
      <ul class="order-items">${itemsHtml || "<li>（無品項）</li>"}</ul>
    `;

    ordersDiv.appendChild(card);
  });
}

window.updateStatus =
function(id, newStatus){

  const orders =
    JSON.parse(
      localStorage.getItem(
        "activeOrders"
      )
    ) || [];

  const targetOrder =
    orders.find(
      order => order.id == id
    );

  if(targetOrder){

    targetOrder.status =
      newStatus;

    if(newStatus === "完成"){

      const historyOrders =
        JSON.parse(
          localStorage.getItem(
            "historyOrders"
          )
        ) || [];

      historyOrders.push(targetOrder);

      localStorage.setItem(
        "historyOrders",
        JSON.stringify(historyOrders)
      );

      const activeOnly =
        orders.filter(
          order => order.id != id
        );

      localStorage.setItem(
        "activeOrders",
        JSON.stringify(activeOnly)
      );

    } else {

      localStorage.setItem(
        "activeOrders",
        JSON.stringify(orders)
      );

    }

  }

  location.reload();

};
</script>

<script type="module">
import { renderSidebar } from "./components/sidebar.js";

document.getElementById("sidebar").innerHTML =
  renderSidebar();
</script>

</body>
</html>
