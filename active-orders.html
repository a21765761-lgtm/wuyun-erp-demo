<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>進行中訂單｜舞韻</title>
  <style>
    body {
      margin: 0;
      padding: 40px;
      background: #0f172a;
      color: white;
      font-family: Arial, "Noto Sans TC", sans-serif;
    }

    .container {
      max-width: 900px;
      margin: auto;
    }

    h1 {
      color: #2dd4bf;
      margin-bottom: 8px;
    }

    .nav {
      margin-bottom: 28px;
    }

    .nav a {
      color: #2dd4bf;
      text-decoration: none;
    }

    .nav a:hover {
      text-decoration: underline;
    }

    #orders p {
      color: #94a3b8;
      padding: 24px 0;
    }

    .order-card {
      background: #1e293b;
      padding: 24px;
      border-radius: 16px;
      margin-bottom: 20px;
      border: 1px solid #334155;
    }

    .order-card h3 {
      margin: 0 0 8px;
      color: #2dd4bf;
    }

    .order-meta {
      font-size: 0.9rem;
      color: #cbd5e1;
      margin-bottom: 16px;
    }

    .status {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(45, 212, 191, 0.15);
      color: #5eead4;
      font-size: 0.8rem;
      margin-left: 8px;
    }

    .order-items {
      margin: 0;
      padding-left: 20px;
      color: #e2e8f0;
      line-height: 1.8;
    }
  </style>
</head>
<body>

<div class="container">
  <p class="nav"><a href="index.html">← 返回 Dashboard</a></p>
  <h1>進行中訂單</h1>
  <div id="orders"></div>
</div>

<script>
const orders = JSON.parse(
  localStorage.getItem("activeOrders")
) || [];

const ordersDiv = document.getElementById("orders");

if (orders.length === 0) {
  ordersDiv.innerHTML = "<p>目前沒有進行中訂單</p>";
} else {
  orders.forEach(order => {
    const card = document.createElement("div");
    card.className = "order-card";

    const created = order.createdAt
      ? new Date(order.createdAt).toLocaleString("zh-TW")
      : "—";

    const itemsHtml = (order.items || [])
      .map(item => {
        const name = item.productName || "品項";
        const size = item.size ? ` · ${item.size}` : "";
        const qty = item.quantity ?? 1;
        return `<li>${name}${size} × ${qty}</li>`;
      })
      .join("");

    card.innerHTML = `
      <h3>訂單 #${order.id}<span class="status">${order.status || "待確認"}</span></h3>
      <p class="order-meta">建立時間：${created}</p>
      <ul class="order-items">${itemsHtml || "<li>（無品項）</li>"}</ul>
    `;

    ordersDiv.appendChild(card);
  });
}
</script>

</body>
</html>
