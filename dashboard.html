<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />

  <meta name="viewport"
    content="width=device-width, initial-scale=1.0"/>

  <title>舞韻 ERP Dashboard</title>
  <link rel="stylesheet" href="./styles/erp-layout.css" />
  <style>
    .section-warn { color: #f87171; }
    .section-return { color: #facc15; }
    .section-ship { color: #2dd4bf; }
  </style>
</head>

<body>

<div class="sidebar">

  <div class="logo">
    舞韻 ERP
  </div>

  <a class="nav-link" href="dashboard.html">Dashboard</a>

  <a class="nav-link" href="active-orders.html">進行中訂單</a>

  <a class="nav-link" href="history-orders.html">歷史訂單</a>

  <a class="nav-link" href="calendar.html">庫存行事曆</a>

</div>

<div class="main">

<h1 class="page-title">舞韻 ERP Dashboard</h1>

<div class="grid">

  <!-- 本月訂單 -->
  <div class="card">

    <div class="stat-title">
      本月訂單
    </div>

    <div
      class="stat-value"
      id="monthly-orders"
    >
      0
    </div>

  </div>

  <!-- 本月營收 -->
  <div class="card">

    <div class="stat-title">
      本月營收
    </div>

    <div
      class="stat-value"
      id="monthly-revenue"
    >
      $0
    </div>

  </div>

  <!-- 進行中訂單 -->
  <div class="card">

    <div class="stat-title">
      進行中訂單
    </div>

    <div
      class="stat-value"
      id="active-count"
    >
      0
    </div>

  </div>

  <!-- 今日表演 -->
  <div class="card">

    <div class="stat-title">
      今日表演
    </div>

    <div id="today-performance">
      無
    </div>

  </div>

</div>

<div
  class="card"
  style="margin-top:30px;"
>
  <h2 class="section-warn">
    ⚠️ 庫存不足警示
  </h2>

  <div id="stock-warning"></div>
</div>

<div
  class="card"
  style="margin-top:30px;"
>
  <h2 class="section-return">
    即將歸還
  </h2>

  <div id="return-list"></div>
</div>

<!-- 待出貨 -->
<div
  class="card"
  style="margin-top:30px;"
>

  <h2 class="section-ship">
    待出貨訂單
  </h2>

  <div id="shipping-list"></div>

</div>

<script>

const activeOrders =
  JSON.parse(
    localStorage.getItem(
      "activeOrders"
    )
  ) || [];

document.getElementById(
  "active-count"
).innerText =
  activeOrders.length;

// 本月訂單數
document.getElementById(
  "monthly-orders"
).innerText =
  activeOrders.length;

// 假營收
const revenue =
  activeOrders.length * 5000;

document.getElementById(
  "monthly-revenue"
).innerText =
  `$${revenue}`;

// 今日表演
const today =
  new Date().toDateString();

const todayPerformance =
  activeOrders.find(order => {

    return order.items.some(item => {

      return new Date(
        item.performanceDate
      ).toDateString() === today;

    });

  });

if(todayPerformance){

  document.getElementById(
    "today-performance"
  ).innerText =
    `訂單 ${todayPerformance.id}`;

}

// 待出貨
const shippingList =
  document.getElementById(
    "shipping-list"
  );

const shippingOrders =
  activeOrders.filter(
    order =>
      order.status === "待出貨"
  );

if(shippingOrders.length === 0){

  shippingList.innerHTML =
    "<p>目前沒有待出貨訂單</p>";

}else{

  shippingOrders.forEach(order => {

    const div =
      document.createElement("div");

    div.className =
      "list-item";

    div.innerHTML = `

      訂單編號：
      ${order.id}<br>

      狀態：
      ${order.status}

    `;

    shippingList.appendChild(div);

  });

}

const inventory = [

  {
    name:"敦煌飛天舞服",

    sizes:{
      S:10,
      M:3,
      L:1
    }
  },

  {
    name:"原民羽飾套裝",

    sizes:{
      S:0,
      M:2,
      L:5
    }
  }

];

const warningDiv =
  document.getElementById(
    "stock-warning"
  );

inventory.forEach(product => {

  Object.entries(
    product.sizes
  ).forEach(([size,qty]) => {

    if(qty <= 2){

      const div =
        document.createElement("div");

      div.className =
        "list-item";

      div.innerHTML = `

        ${product.name}
        ｜${size} 尺寸

        <br>

        剩餘：
        ${qty}

      `;

      warningDiv.appendChild(div);

    }

  });

});

if(
  warningDiv.innerHTML === ""
){

  warningDiv.innerHTML =
    "<p>目前庫存充足</p>";

}

const returnList =
  document.getElementById(
    "return-list"
  );

const now = new Date();

activeOrders.forEach(order => {

  order.items.forEach(item => {

    const performance =
      new Date(
        item.performanceDate
      );

    // N天後歸還
    const returnDate =
      new Date(performance);

    returnDate.setDate(
      returnDate.getDate() + 3
    );

    const diffTime =
      returnDate - now;

    const diffDays =
      Math.ceil(
        diffTime /
        (1000 * 60 * 60 * 24)
      );

    // 3天內顯示
    if(
      diffDays >= 0 &&
      diffDays <= 3
    ){

      const div =
        document.createElement("div");

      div.className =
        "list-item";

      div.innerHTML = `

        訂單：
        ${order.id}<br>

        品項：
        ${item.productName}<br>

        歸還日：
        ${returnDate
          .toLocaleDateString()}<br>

        剩餘：
        ${diffDays} 天

      `;

      returnList.appendChild(div);

    }

  });

});

if(
  returnList.innerHTML === ""
){

  returnList.innerHTML =
    "<p>目前沒有即將歸還訂單</p>";

}

</script>

</div>

</body>
</html>
