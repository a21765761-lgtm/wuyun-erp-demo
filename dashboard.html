<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ERP Dashboard · 舞韻</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="brand.css" />
  <link rel="stylesheet" href="styles/erp-layout.css" />
</head>
<body class="erp-body">
  <div id="erp-stage" aria-hidden="true"></div>
  <div class="sidebar-overlay" id="erpSidebarOverlay"></div>
  <div class="app">
    <div id="erp-sidebar"></div>
    <main class="main">
      <header class="header erp-page-header">
        <div class="header-left">
          <button class="menu-toggle" id="erpMenuToggle" type="button" aria-label="選單">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
          </button>
          <div>
            <div class="greeting">舞韻 <span>ERP 後台</span></div>
            <div class="header-date" id="erpHeaderDate"></div>
          </div>
        </div>
      </header>

      <div class="content">
        <div class="page-head">
          <div>
            <h1 class="page-title">Dashboard</h1>
            <p class="page-desc">以「剩餘可租庫存」掌握營運全局</p>
          </div>
        </div>

        <div class="quick-grid">
          <a href="active-orders.html" class="quick-card">
            <span class="quick-card-icon">📋</span>
            <strong>進行中訂單</strong>
            <span>管理待確認與出貨訂單</span>
          </a>
          <a href="calendar.html" class="quick-card">
            <span class="quick-card-icon">📅</span>
            <strong>庫存壓力行事曆</strong>
            <span>依日查看剩餘可租數量</span>
          </a>
          <a href="history-orders.html" class="quick-card">
            <span class="quick-card-icon">✓</span>
            <strong>歷史訂單</strong>
            <span>已完成訂單紀錄</span>
          </a>
        </div>

        <div class="erp-grid">
          <article class="erp-card">
            <div class="stat-title">進行中訂單</div>
            <div class="stat-value" id="active-count">0</div>
          </article>
          <article class="erp-card">
            <div class="stat-title">低庫存 SKU</div>
            <div class="stat-value" id="low-stock-count">0</div>
          </article>
          <article class="erp-card">
            <div class="stat-title">即將售罄</div>
            <div class="stat-value" id="sellout-count">0</div>
          </article>
          <article class="erp-card">
            <div class="stat-title">配件警示</div>
            <div class="stat-value" id="accessory-count">0</div>
          </article>
        </div>

        <article class="erp-card">
          <h2 class="section-title warn">即將低庫存</h2>
          <p class="section-desc">剩餘可租 1～3 件（今日檔期基準）</p>
          <div id="low-stock-list"></div>
        </article>

        <article class="erp-card">
          <h2 class="section-title return">熱門尺寸不足</h2>
          <p class="section-desc">出租率 ≥ 50% 且剩餘 ≤ 5 件</p>
          <div id="hot-size-list"></div>
        </article>

        <article class="erp-card">
          <h2 class="section-title ship">即將售罄</h2>
          <p class="section-desc">剩餘可租 ≤ 1 件</p>
          <div id="sellout-list"></div>
        </article>

        <article class="erp-card">
          <h2 class="section-title warn">配件不足提醒</h2>
          <div id="accessory-list"></div>
        </article>

        <article class="erp-card">
          <h2 class="section-title return">即將歸還</h2>
          <div id="return-list"></div>
        </article>

        <article class="erp-card">
          <h2 class="section-title ship">待出貨訂單</h2>
          <div id="shipping-list"></div>
        </article>
      </div>
    </main>
  </div>

  <script type="module">
    import { mountErpShell } from "./components/erp-app.js";
    import {
      getLowStockAlerts,
      getHotSizeShortages,
      getSellingOutSoon,
      getAccessoryWarnings
    } from "./data/stock-service.js";

    mountErpShell("dashboard");

    const activeOrders = JSON.parse(localStorage.getItem("activeOrders") || "[]");
    document.getElementById("active-count").textContent = activeOrders.length;

    const lowStock = getLowStockAlerts();
    const hotSizes = getHotSizeShortages();
    const sellout = getSellingOutSoon();
    const accessoryWarn = getAccessoryWarnings();

    document.getElementById("low-stock-count").textContent = lowStock.length;
    document.getElementById("sellout-count").textContent = sellout.length;
    document.getElementById("accessory-count").textContent = accessoryWarn.length;

    function renderStockRows(containerId, rows, formatter) {
      const el = document.getElementById(containerId);
      if (!rows.length) {
        el.innerHTML = '<p class="empty-msg">目前無警示項目</p>';
        return;
      }
      el.innerHTML = rows.map(formatter).join("");
    }

    renderStockRows("low-stock-list", lowStock, s => `
      <div class="list-item stock-row stock-${s.level}">
        <strong>${s.costumeName} · ${s.size}</strong><br>
        剩餘可租 <em>${s.remaining}</em> 件 · 已租 ${s.rented} / 原始 ${s.totalStock}
        <span class="stock-badge stock-${s.level}">${s.label}</span>
      </div>
    `);

    renderStockRows("hot-size-list", hotSizes, s => {
      const rate = Math.round((s.rented / s.totalStock) * 100);
      return `
      <div class="list-item stock-row stock-${s.level}">
        <strong>${s.costumeName} · ${s.size}</strong><br>
        出租率 ${rate}% · 剩餘 ${s.remaining} 件
        <span class="stock-badge stock-${s.level}">${s.label}</span>
      </div>`;
    });

    renderStockRows("sellout-list", sellout, s => `
      <div class="list-item stock-row stock-${s.level}">
        <strong>${s.costumeName} · ${s.size}</strong><br>
        剩餘可租 ${s.remaining} 件 · 建議補貨或調檔
      </div>
    `);

    renderStockRows("accessory-list", accessoryWarn, s => `
      <div class="list-item stock-row stock-${s.level}">
        <strong>${s.name}</strong><br>
        剩餘 ${s.remaining} 件 · 已租 ${s.rented} / 原始 ${s.totalStock}
      </div>
    `);

    const shippingList = document.getElementById("shipping-list");
    const shippingOrders = activeOrders.filter(o => o.status === "待出貨");
    if (shippingOrders.length === 0) {
      shippingList.innerHTML = '<p class="empty-msg">目前沒有待出貨訂單</p>';
    } else {
      shippingOrders.forEach(order => {
        const div = document.createElement("div");
        div.className = "list-item";
        div.innerHTML = `訂單編號：${order.id}<br>狀態：${order.status}`;
        shippingList.appendChild(div);
      });
    }

    const returnList = document.getElementById("return-list");
    const now = new Date();
    activeOrders.forEach(order => {
      (order.items || []).forEach(item => {
        if (!item.performanceDate) return;
        const returnDate = new Date(item.performanceDate);
        returnDate.setDate(returnDate.getDate() + 3);
        const diffDays = Math.ceil((returnDate - now) / (1000 * 60 * 60 * 24));
        if (diffDays >= 0 && diffDays <= 3) {
          const div = document.createElement("div");
          div.className = "list-item";
          div.innerHTML = `訂單：${order.id}<br>品項：${item.productName}<br>歸還日：${returnDate.toLocaleDateString("zh-TW")}<br>剩餘：${diffDays} 天`;
          returnList.appendChild(div);
        }
      });
    });
    if (!returnList.innerHTML) returnList.innerHTML = '<p class="empty-msg">目前沒有即將歸還訂單</p>';
  </script>
</body>
</html>
