<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>舞韻舞蹈服飾 ERP · 庫存管理</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600;700&family=Noto+Serif+TC:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="brand.css" />
</head>
<body>
  <div class="stage-bg" aria-hidden="true">
    <div class="neon-grid"></div>
    <div class="neon-beam neon-beam-1"></div>
    <div class="neon-beam neon-beam-2"></div>
    <div class="neon-beam neon-beam-3"></div>
    <div class="spotlight spotlight-main"></div>
    <div class="spotlight spotlight-left"></div>
    <div class="spotlight spotlight-right"></div>
    <div class="spotlight spotlight-purple"></div>
    <div class="stage-vignette"></div>
    <div class="stage-floor"></div>
  </div>

  <div class="app">
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand sidebar-brand--compact">
        <p class="sidebar-eyebrow">舞台營運 · 導航</p>
      </div>

      <nav class="sidebar-nav">
        <p class="nav-label">舞台導航</p>
        <a href="index.html" class="nav-item">
          <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></span>
          <span class="nav-text">Dashboard</span>
        </a>
        <a href="order.html" class="nav-item">
          <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/></svg></span>
          <span class="nav-text">訂單管理</span>
        </a>
        <a href="inventory.html" class="nav-item active">
          <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg></span>
          <span class="nav-text">庫存管理</span>
        </a>
        <a href="shipping.html" class="nav-item">
          <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M1 3h15v13H1zM16 8h4l3 3v5h-7V8z"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg></span>
          <span class="nav-text">出貨管理</span>
        </a>
        <a href="laundry.html" class="nav-item">
          <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"/></svg></span>
          <span class="nav-text">洗滌管理</span>
        </a>
        <a href="analytics.html" class="nav-item">
          <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg></span>
          <span class="nav-text">報表分析</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="user-pill">
          <div class="user-avatar">林</div>
          <div class="user-meta">
            <div class="name">林曉雯</div>
            <div class="role">營運總監</div>
          </div>
        </div>
      </div>
    </aside>

    <main class="main">
      <header class="header">
        <div class="header-left">
          <button class="menu-toggle" id="menuToggle" type="button" aria-label="選單">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
          </button>
          <nav class="breadcrumb">
            <a href="index.html">Dashboard</a>
            <span> / </span>
            <strong>庫存管理</strong>
          </nav>
        </div>
        <div class="header-actions">
          <a href="#" class="btn-gold">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
            新增服裝
          </a>
          <a href="index.html" class="header-logo" title="舞韻舞蹈服飾 ERP">
            <span class="header-logo-mark" aria-hidden="true">舞</span>
            <span class="header-logo-text"><strong>舞韻</strong><small>DANCE ERP</small></span>
          </a>
        </div>
      </header>

      <div class="content">
        <div class="page-intro">
          <h2>庫存管理</h2>
          <p>掌握每一件表演服的庫存、櫃位與配件狀態</p>
        </div>

        <div class="kpi-grid" id="kpiGrid">
          <article class="kpi-card">
            <div class="kpi-label">總服裝數量</div>
            <div class="kpi-value" id="kpiTotal">0</div>
          </article>
          <article class="kpi-card">
            <div class="kpi-label">可出租數量</div>
            <div class="kpi-value gold" id="kpiAvailable">0</div>
          </article>
          <article class="kpi-card">
            <div class="kpi-label">維修中</div>
            <div class="kpi-value" id="kpiRepair">0</div>
          </article>
          <article class="kpi-card">
            <div class="kpi-label">洗滌中</div>
            <div class="kpi-value" id="kpiWashing">0</div>
          </article>
          <article class="kpi-card alert-card">
            <div class="kpi-label">庫存不足</div>
            <div class="kpi-value danger" id="kpiLow">0</div>
          </article>
        </div>

        <div class="filter-card">
          <div class="filter-grid">
            <div class="field">
              <label for="filterKeyword">關鍵字搜尋</label>
              <input type="text" id="filterKeyword" placeholder="服裝名稱、SKU…" />
            </div>
            <div class="field">
              <label for="filterSize">尺寸</label>
              <select id="filterSize">
                <option value="">全部尺寸</option>
                <option value="XS">XS</option>
                <option value="S">S</option>
                <option value="M">M</option>
                <option value="L">L</option>
                <option value="XL">XL</option>
                <option value="均碼">均碼</option>
              </select>
            </div>
            <div class="field">
              <label for="filterType">類型</label>
              <select id="filterType">
                <option value="">全部類型</option>
                <option value="原民">原民</option>
                <option value="古典">古典</option>
                <option value="國風">國風</option>
                <option value="芭蕾">芭蕾</option>
                <option value="民族">民族</option>
                <option value="現代">現代</option>
                <option value="街舞">街舞</option>
                <option value="拉丁">拉丁</option>
              </select>
            </div>
            <div class="field">
              <label for="filterStock">庫存狀態</label>
              <select id="filterStock">
                <option value="">全部狀態</option>
                <option value="available">可出租</option>
                <option value="repair">維修中</option>
                <option value="washing">洗滌中</option>
                <option value="low-stock">庫存不足</option>
              </select>
            </div>
            <button type="button" class="btn-reset" id="btnReset">清除篩選</button>
          </div>
          <p class="result-hint">顯示 <em id="resultCount">0</em> 項服裝</p>
        </div>

        <div class="table-card">
          <div class="table-wrap">
            <table class="inv-table">
              <thead>
                <tr>
                  <th>服裝名稱</th>
                  <th>類型</th>
                  <th>尺寸</th>
                  <th>總庫存</th>
                  <th>已預約</th>
                  <th>可出租</th>
                  <th>共用配件狀況</th>
                  <th>櫃位位置</th>
                  <th>狀態</th>
                </tr>
              </thead>
              <tbody id="inventoryBody"></tbody>
            </table>
          </div>
          <div class="empty-state" id="emptyState">
            <p>尚無符合條件的服裝</p>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script>
    const alertIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v2m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/></svg>`;
    const locIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>`;

    const STATUS_MAP = {
      available: { label: '可出租', cls: 'available' },
      repair: { label: '維修中', cls: 'repair' },
      washing: { label: '洗滌中', cls: 'washing' },
      'low-stock': { label: '庫存不足', cls: 'low-stock' },
    };

    const inventory = [
      { sku: 'YM-001', name: '原民羽飾套裝', type: '原民', size: 'L', total: 14, reserved: 12, available: 2, accessoryLow: true, sizeLow: true, location: 'A區-2層-08格', status: 'low-stock' },
      { sku: 'DH-012', name: '敦煌飛天舞服', type: '古典', size: 'M', total: 18, reserved: 15, available: 3, accessoryLow: true, sizeLow: false, location: 'A區-3層-12格', status: 'low-stock' },
      { sku: 'GF-003', name: '國風水袖服', type: '國風', size: 'M', total: 16, reserved: 13, available: 3, accessoryLow: true, sizeLow: true, location: 'A區-3層-15格', status: 'low-stock' },
      { sku: 'HK-018', name: '客家花布舞裙', type: '民族', size: '均碼', total: 22, reserved: 10, available: 12, accessoryLow: false, sizeLow: false, location: 'B區-2層-05格', status: 'available' },
      { sku: 'MD-027', name: '現代黑金流蘇服', type: '現代', size: 'L', total: 12, reserved: 5, available: 7, accessoryLow: false, sizeLow: false, location: 'C區-1層-03格', status: 'available' },
      { sku: 'ST-009', name: '街舞寬鬆套裝', type: '街舞', size: 'L', total: 20, reserved: 14, available: 6, accessoryLow: false, sizeLow: true, location: 'C區-4層-02格', status: 'available' },
      { sku: 'BT-022', name: '兒童芭蕾粉 Tutu', type: '芭蕾', size: 'XS', total: 28, reserved: 22, available: 0, accessoryLow: false, sizeLow: false, location: '洗滌區-A線', status: 'washing' },
      { sku: 'MZ-006', name: '少數民族措朗舞袍', type: '民族', size: 'XL', total: 8, reserved: 6, available: 1, accessoryLow: true, sizeLow: true, location: 'B區-1層-06格', status: 'low-stock' },
      { sku: 'LD-011', name: '肚皮舞亮片腰裙', type: '拉丁', size: 'S', total: 14, reserved: 4, available: 10, accessoryLow: true, sizeLow: false, location: 'B區-3層-11格', status: 'low-stock' },
      { sku: 'GF-019', name: '古典雲肩漢服套', type: '國風', size: 'L', total: 10, reserved: 0, available: 0, accessoryLow: false, sizeLow: false, location: 'D區-1層-02格', status: 'repair' },
      { sku: 'ST-014', name: '街舞連帽表演服', type: '街舞', size: 'M', total: 24, reserved: 8, available: 0, accessoryLow: false, sizeLow: false, location: '洗滌區-B線', status: 'washing' },
      { sku: 'YM-008', name: '泰雅族編織舞衣', type: '原民', size: 'M', total: 6, reserved: 2, available: 2, accessoryLow: true, sizeLow: false, location: 'A區-1層-04格', status: 'low-stock' },
      { sku: 'MD-035', name: '現代舞霧面緊身衣', type: '現代', size: 'S', total: 18, reserved: 3, available: 15, accessoryLow: false, sizeLow: false, location: 'C區-2層-09格', status: 'available' },
      { sku: 'DH-021', name: '敦煌反彈琵琶服', type: '古典', size: 'S', total: 9, reserved: 7, available: 2, accessoryLow: true, sizeLow: true, location: 'A區-4層-07格', status: 'low-stock' },
      { sku: 'BT-031', name: '成人芭蕾練功服白', type: '芭蕾', size: 'M', total: 32, reserved: 6, available: 0, accessoryLow: false, sizeLow: false, location: '洗滌區-待上架', status: 'washing' },
    ];

    function updateKpis(data) {
      const totalQty = data.reduce((s, i) => s + i.total, 0);
      const availableQty = data.reduce((s, i) => s + i.available, 0);
      const repairQty = data.filter(i => i.status === 'repair').reduce((s, i) => s + i.total, 0);
      const washingQty = data.filter(i => i.status === 'washing').reduce((s, i) => s + i.total, 0);
      const lowCount = data.filter(i => i.status === 'low-stock' || i.available <= 3).length;

      document.getElementById('kpiTotal').textContent = totalQty;
      document.getElementById('kpiAvailable').textContent = availableQty;
      document.getElementById('kpiRepair').textContent = repairQty;
      document.getElementById('kpiWashing').textContent = washingQty;
      document.getElementById('kpiLow').textContent = lowCount;
    }

    function renderAccessory(item) {
      if (item.accessoryLow) {
        return `<span class="alert-pill danger">${alertIcon}共用配件不足</span>`;
      }
      return `<span class="accessory-ok">配件充足</span>`;
    }

    function renderSizeCell(item) {
      const sizeClass = item.sizeLow ? 'size-badge low' : 'size-badge';
      let html = `<span class="${sizeClass}">${item.size}</span>`;
      if (item.sizeLow) {
        html += ` <span class="alert-pill size-warn">${alertIcon}尺寸不足</span>`;
      }
      return html;
    }

    function renderTable(filtered) {
      const tbody = document.getElementById('inventoryBody');
      const empty = document.getElementById('emptyState');
      document.getElementById('resultCount').textContent = filtered.length;

      if (filtered.length === 0) {
        tbody.innerHTML = '';
        empty.classList.add('show');
        return;
      }

      empty.classList.remove('show');

      const hasWarn = (i) => i.accessoryLow || i.sizeLow || i.status === 'low-stock';

      tbody.innerHTML = filtered.map(item => {
        const st = STATUS_MAP[item.status] || STATUS_MAP.available;
        const availClass = item.available <= 3 ? 'num low' : 'num available';

        return `
          <tr class="${hasWarn(item) ? 'row-warn' : ''}">
            <td>
              <div class="cell-name">
                <div class="item-thumb">${item.name.slice(0, 1)}</div>
                <div>
                  <span class="title">${item.name}</span>
                  <span class="sku">${item.sku}</span>
                </div>
              </div>
            </td>
            <td><span class="type-tag">${item.type}</span></td>
            <td>${renderSizeCell(item)}</td>
            <td><span class="num">${item.total}</span></td>
            <td><span class="num">${item.reserved}</span></td>
            <td><span class="${availClass}">${item.available}</span></td>
            <td>${renderAccessory(item)}</td>
            <td>
              <span class="loc-tag">${locIcon}${item.location}</span>
            </td>
            <td><span class="status-badge ${st.cls}">${st.label}</span></td>
          </tr>
        `;
      }).join('');
    }

    function applyFilters() {
      const kw = document.getElementById('filterKeyword').value.trim().toLowerCase();
      const size = document.getElementById('filterSize').value;
      const type = document.getElementById('filterType').value;
      const stock = document.getElementById('filterStock').value;

      const filtered = inventory.filter(item => {
        if (kw && !item.name.toLowerCase().includes(kw) && !item.sku.toLowerCase().includes(kw)) return false;
        if (size && item.size !== size) return false;
        if (type && item.type !== type) return false;
        if (stock && item.status !== stock) return false;
        return true;
      });

      renderTable(filtered);
    }

    function initSidebar() {
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('sidebarOverlay');
      const close = () => {
        sidebar?.classList.remove('open');
        overlay?.classList.remove('open');
      };
      document.getElementById('menuToggle')?.addEventListener('click', () => {
        sidebar.classList.toggle('open');
        overlay.classList.toggle('open');
      });
      overlay?.addEventListener('click', close);
      document.querySelectorAll('.sidebar-nav .nav-item[href]').forEach(link => {
        link.addEventListener('click', () => {
          if (window.innerWidth <= 768) close();
        });
      });
      const current = (location.pathname.split('/').pop() || 'index.html').toLowerCase();
      document.querySelectorAll('.sidebar-nav .nav-item[href]').forEach(a => {
        a.classList.toggle('active', a.getAttribute('href').toLowerCase() === current);
      });
    }

    document.getElementById('filterKeyword').addEventListener('input', applyFilters);
    document.getElementById('filterSize').addEventListener('change', applyFilters);
    document.getElementById('filterType').addEventListener('change', applyFilters);
    document.getElementById('filterStock').addEventListener('change', applyFilters);
    document.getElementById('btnReset').addEventListener('click', () => {
      document.getElementById('filterKeyword').value = '';
      document.getElementById('filterSize').value = '';
      document.getElementById('filterType').value = '';
      document.getElementById('filterStock').value = '';
      applyFilters();
    });

    updateKpis(inventory);
    applyFilters();
    initSidebar();
  </script>
</body>
</html>
