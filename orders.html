<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>舞韻舞蹈服飾 ERP · 訂單管理</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600;700&family=Noto+Serif+TC:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="brand.css" />
</head>
<body>
  <div class="stage-bg" aria-hidden="true">
    <div class="neon-grid"></div>
    <div class="neon-beam neon-beam-1"></div>
    <div class="neon-beam neon-beam-2"></div>
    <div class="neon-beam neon-beam-3"></div>
    <div class="spotlight spotlight-main"></div>
    <div class="spotlight spotlight-left"></div>
    <div class="spotlight spotlight-right"></div>
    <div class="spotlight spotlight-purple"></div>
    <div class="stage-vignette"></div>
    <div class="stage-floor"></div>
  </div>

  <div class="app">
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand sidebar-brand--compact">
        <p class="sidebar-eyebrow">舞台營運 · 導航</p>
      </div>

      <nav class="sidebar-nav">
        <p class="nav-label">舞台導航</p>
        <a href="index.html" class="nav-item">
          <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></span>
          <span class="nav-text">Dashboard</span>
        </a>
        <a href="order.html" class="nav-item active">
          <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/></svg></span>
          <span class="nav-text">訂單管理</span>
        </a>
        <a href="inventory.html" class="nav-item">
          <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg></span>
          <span class="nav-text">庫存管理</span>
        </a>
        <a href="shipping.html" class="nav-item">
          <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M1 3h15v13H1zM16 8h4l3 3v5h-7V8z"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg></span>
          <span class="nav-text">出貨管理</span>
        </a>
        <a href="laundry.html" class="nav-item">
          <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"/></svg></span>
          <span class="nav-text">洗滌管理</span>
        </a>
        <a href="analytics.html" class="nav-item">
          <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg></span>
          <span class="nav-text">報表分析</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="user-pill">
          <div class="user-avatar">林</div>
          <div class="user-meta">
            <div class="name">林曉雯</div>
            <div class="role">營運總監</div>
          </div>
        </div>
      </div>
    </aside>

    <main class="main">
      <header class="header">
        <div class="header-left">
          <button class="menu-toggle" id="menuToggle" type="button" aria-label="選單">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
          </button>
          <nav class="breadcrumb">
            <a href="index.html">Dashboard</a>
            <span> / </span>
            <strong>訂單管理</strong>
          </nav>
        </div>
        <div class="header-actions">
          <a href="#" class="btn-gold">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
            建立訂單
          </a>
          <a href="index.html" class="header-logo" title="舞韻舞蹈服飾 ERP">
            <span class="header-logo-mark" aria-hidden="true">舞</span>
            <span class="header-logo-text"><strong>舞韻</strong><small>DANCE ERP</small></span>
          </a>
        </div>
      </header>

      <div class="content">
        <div class="page-top">
          <div>
            <h2>訂單管理</h2>
            <p class="subtitle">管理所有表演服租借訂單與出貨排程</p>
          </div>
          <div class="mini-stats">
            <div class="mini-stat">
              <div class="label">今日訂單數</div>
              <div class="value" id="statTodayOrders">12</div>
            </div>
            <div class="mini-stat">
              <div class="label">今日待出貨</div>
              <div class="value gold" id="statTodayShip">5</div>
            </div>
          </div>
        </div>

        <div class="filter-card">
          <div class="filter-grid">
            <div class="field">
              <label for="filterCustomer">客戶名稱</label>
              <input type="text" id="filterCustomer" placeholder="輸入客戶或舞團名稱…" />
            </div>
            <div class="field">
              <label for="filterShowDate">表演日期</label>
              <input type="date" id="filterShowDate" />
            </div>
            <div class="field">
              <label for="filterStatus">狀態</label>
              <select id="filterStatus">
                <option value="">全部狀態</option>
                <option value="pending">待確認</option>
                <option value="modify">待修改</option>
                <option value="ready">待出貨</option>
                <option value="shipped">已出貨</option>
                <option value="returned">已歸還</option>
                <option value="washing">洗滌中</option>
                <option value="stored">已歸位</option>
              </select>
            </div>
            <button type="button" class="btn-reset" id="btnReset">清除篩選</button>
          </div>
          <p class="result-hint">共 <em id="resultCount">0</em> 筆訂單符合條件</p>
        </div>

        <div class="table-card">
          <div class="table-wrap">
            <table class="orders-table">
              <thead>
                <tr>
                  <th>訂單編號</th>
                  <th>客戶名稱</th>
                  <th>表演日期</th>
                  <th>出貨日期</th>
                  <th>套數</th>
                  <th>狀態</th>
                  <th>庫存狀況</th>
                  <th>修改狀況</th>
                </tr>
              </thead>
              <tbody id="ordersBody"></tbody>
            </table>
          </div>
          <div class="empty-state" id="emptyState">
            <p>尚無符合條件的訂單</p>
            <span>請調整搜尋或篩選條件</span>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script>
    const STATUS_MAP = {
      pending:  { label: '待確認', cls: 'pending' },
      modify:   { label: '待修改', cls: 'modify' },
      ready:    { label: '待出貨', cls: 'ready' },
      shipped:  { label: '已出貨', cls: 'shipped' },
      returned: { label: '已歸還', cls: 'returned' },
      washing:  { label: '洗滌中', cls: 'washing' },
      stored:   { label: '已歸位', cls: 'stored' },
    };

    const orders = [
      { id: 'WY-260518-001', customer: '嘉義女中舞蹈班', showDate: '2026-05-24', shipDate: '2026-05-18', qty: 18, status: 'ready', stockLow: true, needModify: false },
      { id: 'WY-260518-002', customer: '台南民族舞團', showDate: '2026-05-22', shipDate: '2026-05-18', qty: 14, status: 'modify', stockLow: false, needModify: true },
      { id: 'WY-260518-003', customer: '星光兒童舞蹈教室', showDate: '2026-05-25', shipDate: '2026-05-20', qty: 22, status: 'pending', stockLow: true, needModify: false },
      { id: 'WY-260518-004', customer: '雲林表演藝術中心', showDate: '2026-05-30', shipDate: '2026-05-26', qty: 30, status: 'pending', stockLow: false, needModify: false },
      { id: 'WY-260518-005', customer: '高雄青春舞團', showDate: '2026-05-28', shipDate: '2026-05-23', qty: 12, status: 'ready', stockLow: false, needModify: false },
      { id: 'WY-260518-016', customer: '台南女子高中街舞社', showDate: '2026-05-23', shipDate: '2026-05-18', qty: 12, status: 'ready', stockLow: true, needModify: false },
      { id: 'WY-260519-006', customer: '新竹韻律街舞工作室', showDate: '2026-06-01', shipDate: '2026-05-27', qty: 16, status: 'pending', stockLow: false, needModify: false },
      { id: 'WY-260520-007', customer: '屏東原舞團', showDate: '2026-06-05', shipDate: '2026-05-30', qty: 10, status: 'pending', stockLow: true, needModify: true },
      { id: 'WY-260521-008', customer: '台北耕莘舞集', showDate: '2026-06-08', shipDate: '2026-06-03', qty: 8, status: 'pending', stockLow: false, needModify: false },
      { id: 'WY-260522-009', customer: '台中現代舞劇場', showDate: '2026-06-10', shipDate: '2026-06-05', qty: 15, status: 'pending', stockLow: false, needModify: false },
      { id: 'WY-260515-010', customer: '桃園全國舞蹈比賽籌備組', showDate: '2026-05-20', shipDate: '2026-05-16', qty: 20, status: 'shipped', stockLow: false, needModify: false },
      { id: 'WY-260514-011', customer: '花蓮阿美祭典舞隊', showDate: '2026-05-19', shipDate: '2026-05-15', qty: 8, status: 'returned', stockLow: false, needModify: false },
      { id: 'WY-260513-012', customer: '基隆海事職校舞蹈班', showDate: '2026-05-17', shipDate: '2026-05-13', qty: 12, status: 'washing', stockLow: false, needModify: false },
      { id: 'WY-260512-013', customer: '彰化員林國中藝才班', showDate: '2026-05-16', shipDate: '2026-05-12', qty: 6, status: 'washing', stockLow: false, needModify: false },
      { id: 'WY-260511-014', customer: '宜蘭蘭陽舞蹈節執委會', showDate: '2026-05-14', shipDate: '2026-05-10', qty: 40, status: 'stored', stockLow: false, needModify: false },
      { id: 'WY-260516-017', customer: '苗栗客家文化館', showDate: '2026-05-21', shipDate: '2026-05-17', qty: 9, status: 'shipped', stockLow: false, needModify: false },
      { id: 'WY-260516-018', customer: '南投埔里國中舞蹈班', showDate: '2026-05-26', shipDate: '2026-05-21', qty: 11, status: 'modify', stockLow: true, needModify: true },
      { id: 'WY-260519-019', customer: '澎湖海上花火節舞團', showDate: '2026-06-12', shipDate: '2026-06-07', qty: 6, status: 'pending', stockLow: false, needModify: false },
      { id: 'WY-260520-020', customer: '新北三芝國小舞蹈班', showDate: '2026-06-02', shipDate: '2026-05-28', qty: 14, status: 'pending', stockLow: false, needModify: false },
      { id: 'WY-260508-021', customer: '台東身聲田野舞團', showDate: '2026-05-10', shipDate: '2026-05-06', qty: 7, status: 'shipped', stockLow: false, needModify: false },
      { id: 'WY-260506-022', customer: '金門中小學聯合舞展', showDate: '2026-05-08', shipDate: '2026-05-04', qty: 25, status: 'returned', stockLow: false, needModify: false },
      { id: 'WY-260523-023', customer: '台南孔廟祭典舞蹈團', showDate: '2026-06-15', shipDate: '2026-06-10', qty: 18, status: 'pending', stockLow: false, needModify: false },
      { id: 'WY-260524-024', customer: '台北兒童藝術節籌備處', showDate: '2026-06-17', shipDate: '2026-06-12', qty: 35, status: 'pending', stockLow: true, needModify: false },
    ];

    const alertIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v2m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/></svg>`;

    function formatDate(str) {
      if (!str) return '—';
      const d = new Date(str + 'T00:00:00');
      return d.toLocaleDateString('zh-TW', { month: 'short', day: 'numeric', weekday: 'short' });
    }

    function renderTable(filtered) {
      const tbody = document.getElementById('ordersBody');
      const empty = document.getElementById('emptyState');
      const countEl = document.getElementById('resultCount');

      countEl.textContent = filtered.length;

      if (filtered.length === 0) {
        tbody.innerHTML = '';
        empty.classList.add('show');
        return;
      }

      empty.classList.remove('show');

      tbody.innerHTML = filtered.map(o => {
        const st = STATUS_MAP[o.status];
        const stockCell = o.stockLow
          ? `<span class="stock-alert">${alertIcon}庫存不足</span>`
          : `<span class="stock-ok">庫存充足</span>`;
        const modifyCell = o.needModify
          ? `<span class="modify-yes">● 待調整尺寸/配件</span>`
          : `<span class="modify-none">無需修改</span>`;

        return `
          <tr class="${o.stockLow ? 'row-alert' : ''}" data-id="${o.id}">
            <td><span class="cell-id">${o.id}</span></td>
            <td><span class="cell-customer">${o.customer}</span></td>
            <td class="cell-date">${formatDate(o.showDate)}</td>
            <td class="cell-date">${formatDate(o.shipDate)}</td>
            <td><span class="cell-qty">${o.qty}</span> 套</td>
            <td><span class="badge ${st.cls}">${st.label}</span></td>
            <td>${stockCell}</td>
            <td>${modifyCell}</td>
          </tr>
        `;
      }).join('');
    }

    function applyFilters() {
      const customer = document.getElementById('filterCustomer').value.trim().toLowerCase();
      const showDate = document.getElementById('filterShowDate').value;
      const status = document.getElementById('filterStatus').value;

      const filtered = orders.filter(o => {
        if (customer && !o.customer.toLowerCase().includes(customer)) return false;
        if (showDate && o.showDate !== showDate) return false;
        if (status && o.status !== status) return false;
        return true;
      });

      renderTable(filtered);
    }

    function updateHeaderStats() {
      const today = '2026-05-18';
      const todayOrders = orders.filter(o => o.shipDate === today || o.id.includes('260518')).length;
      const todayShip = orders.filter(o => o.shipDate === today && ['ready', 'modify'].includes(o.status)).length;
      document.getElementById('statTodayOrders').textContent = todayOrders;
      document.getElementById('statTodayShip').textContent = todayShip;
    }

    function initSidebar() {
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('sidebarOverlay');
      const close = () => {
        sidebar?.classList.remove('open');
        overlay?.classList.remove('open');
      };
      document.getElementById('menuToggle')?.addEventListener('click', () => {
        sidebar.classList.toggle('open');
        overlay.classList.toggle('open');
      });
      overlay?.addEventListener('click', close);
      document.querySelectorAll('.sidebar-nav .nav-item[href]').forEach(link => {
        link.addEventListener('click', () => {
          if (window.innerWidth <= 768) close();
        });
      });
      const current = (location.pathname.split('/').pop() || 'index.html').toLowerCase();
      document.querySelectorAll('.sidebar-nav .nav-item[href]').forEach(a => {
        a.classList.toggle('active', a.getAttribute('href').toLowerCase() === current);
      });
    }

    document.getElementById('filterCustomer').addEventListener('input', applyFilters);
    document.getElementById('filterShowDate').addEventListener('change', applyFilters);
    document.getElementById('filterStatus').addEventListener('change', applyFilters);
    document.getElementById('btnReset').addEventListener('click', () => {
      document.getElementById('filterCustomer').value = '';
      document.getElementById('filterShowDate').value = '';
      document.getElementById('filterStatus').value = '';
      applyFilters();
    });

    updateHeaderStats();
    applyFilters();
    initSidebar();
  </script>
</body>
</html>
