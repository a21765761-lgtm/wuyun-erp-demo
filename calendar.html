<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>庫存行事曆 · 舞韻 ERP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="brand.css" />
  <link rel="stylesheet" href="styles/erp-layout.css" />
</head>
<body class="erp-body">
  <div id="erp-stage" aria-hidden="true"></div>
  <div class="sidebar-overlay" id="erpSidebarOverlay"></div>
  <div class="app">
    <div id="erp-sidebar"></div>
    <main class="main">
      <header class="header erp-page-header">
        <div class="header-left">
          <button class="menu-toggle" id="erpMenuToggle" type="button" aria-label="選單">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
          </button>
          <div>
            <div class="greeting">庫存 <span>行事曆</span></div>
            <div class="header-date" id="erpHeaderDate"></div>
          </div>
        </div>
      </header>

      <div class="content">
        <div class="page-head">
          <div>
            <h1 class="page-title">庫存行事曆</h1>
            <p class="page-desc">顯示檔期占用狀況（進行中訂單 + 範例訂單，已完成不計入）</p>
          </div>
          <div class="page-actions">
            <a href="dashboard.html" class="btn btn-ghost">返回 Dashboard</a>
          </div>
        </div>

        <article class="erp-card">
          <div class="calendar-controls">
            <label>
              年
              <select id="yearSelect"></select>
            </label>
            <label>
              月
              <select id="monthSelect"></select>
            </label>
          </div>

          <div class="calendar-legend">
            <span><i class="dot busy"></i> 已占用</span>
            <span><i class="dot free"></i> 可預約</span>
          </div>

          <div id="weekdays"></div>
          <div id="calendar"></div>
        </article>
      </div>
    </main>
  </div>

  <script type="module">
    import { orders } from "./data/orders.js";
    import { mountErpShell } from "./components/erp-app.js";
    mountErpShell("calendar");

    function calculateOccupiedDates(performanceDate, nDays) {
      const performance = new Date(performanceDate + "T12:00:00");
      const start = new Date(performance);
      start.setDate(start.getDate() - nDays);
      const end = new Date(performance);
      end.setDate(end.getDate() + nDays);
      start.setHours(0, 0, 0, 0);
      end.setHours(23, 59, 59, 999);
      return { start, end };
    }

    function collectOrders() {
      const stored = JSON.parse(localStorage.getItem("activeOrders") || "[]")
        .filter(o => o.status !== "完成");

      const fromStorage = stored
        .map(order => {
          const perf = order.items?.find(i => i.performanceDate)?.performanceDate;
          if (!perf) return null;
          return {
            id: order.id,
            performanceDate: perf,
            nDays: order.nDays ?? 3,
            status: order.status
          };
        })
        .filter(Boolean);

      return [
        ...orders.filter(o => o.status !== "完成"),
        ...fromStorage
      ];
    }

    function isDayOccupied(year, month, day, allOrders) {
      const date = new Date(year, month - 1, day, 12, 0, 0);
      return allOrders.some(order => {
        if (order.status === "完成") return false;
        const { start, end } = calculateOccupiedDates(
          order.performanceDate,
          order.nDays ?? 3
        );
        return date >= start && date <= end;
      });
    }

    const yearSelect = document.getElementById("yearSelect");
    const monthSelect = document.getElementById("monthSelect");
    const calendar = document.getElementById("calendar");
    const weekdaysEl = document.getElementById("weekdays");

    const now = new Date();
    for (let y = now.getFullYear(); y <= now.getFullYear() + 1; y++) {
      yearSelect.innerHTML += `<option value="${y}">${y} 年</option>`;
    }
    for (let m = 1; m <= 12; m++) {
      monthSelect.innerHTML += `<option value="${m}">${m} 月</option>`;
    }
    yearSelect.value = String(now.getFullYear());
    monthSelect.value = String(now.getMonth() + 1);

    function renderCalendar() {
      const year = Number(yearSelect.value);
      const month = Number(monthSelect.value);
      const daysInMonth = new Date(year, month, 0).getDate();
      const allOrders = collectOrders();

      weekdaysEl.innerHTML = ["日", "一", "二", "三", "四", "五", "六"]
        .map(d => `<div class="weekday">${d}</div>`)
        .join("");

      calendar.innerHTML = "";

      const firstWeekday = new Date(year, month - 1, 1).getDay();
      for (let i = 0; i < firstWeekday; i++) {
        calendar.appendChild(document.createElement("div"));
      }

      for (let day = 1; day <= daysInMonth; day++) {
        const occupied = isDayOccupied(year, month, day, allOrders);
        const div = document.createElement("div");
        div.className = "day-cell" + (occupied ? " occupied" : "");
        div.innerHTML = `
          <div class="date">${month}/${day}</div>
          <div class="status ${occupied ? "busy" : "free"}">${occupied ? "已占用" : "可預約"}</div>
        `;
        calendar.appendChild(div);
      }
    }

    yearSelect.addEventListener("change", renderCalendar);
    monthSelect.addEventListener("change", renderCalendar);
    renderCalendar();
  </script>
</body>
</html>
