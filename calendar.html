<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>庫存壓力行事曆 · 舞韻 ERP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="brand.css" />
  <link rel="stylesheet" href="styles/erp-layout.css" />
</head>
<body class="erp-body">
  <div id="erp-stage" aria-hidden="true"></div>
  <div class="sidebar-overlay" id="erpSidebarOverlay"></div>
  <div class="app">
    <div id="erp-sidebar"></div>
    <main class="main">
      <header class="header erp-page-header">
        <div class="header-left">
          <button class="menu-toggle" id="erpMenuToggle" type="button" aria-label="選單">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
          </button>
          <div>
            <div class="greeting">庫存 <span>壓力行事曆</span></div>
            <div class="header-date" id="erpHeaderDate"></div>
          </div>
        </div>
      </header>

      <div class="content">
        <div class="page-head">
          <div>
            <h1 class="page-title">庫存壓力行事曆</h1>
            <p class="page-desc">依日期顯示各款式、各尺寸的剩餘可租數量（非整體占用）</p>
          </div>
          <div class="page-actions">
            <a href="dashboard.html" class="btn btn-ghost">返回 Dashboard</a>
          </div>
        </div>

        <article class="erp-card">
          <div class="calendar-controls">
            <label>年 <select id="yearSelect"></select></label>
            <label>月 <select id="monthSelect"></select></label>
          </div>

          <div class="calendar-legend">
            <span><i class="dot stock-ok"></i> 充足</span>
            <span><i class="dot stock-low"></i> 即將不足（≤3）</span>
            <span><i class="dot stock-tight"></i> 緊張（≤1）</span>
            <span><i class="dot stock-out"></i> 無可租</span>
          </div>

          <div id="weekdays"></div>
          <div id="calendar" class="calendar-pressure-grid"></div>
        </article>

        <article class="erp-card" id="dayDetailCard">
          <h2 class="section-title ship" id="dayDetailTitle">點選日期查看庫存明細</h2>
          <div id="dayDetailList"><p class="empty-msg">請點選月曆上的日期</p></div>
        </article>
      </div>
    </main>
  </div>

  <script type="module">
    import { mountErpShell } from "./components/erp-app.js";
    import { getDayPressureList, LOW_STOCK_THRESHOLD } from "./data/stock-service.js";

    mountErpShell("calendar");

    const yearSelect = document.getElementById("yearSelect");
    const monthSelect = document.getElementById("monthSelect");
    const calendar = document.getElementById("calendar");
    const weekdaysEl = document.getElementById("weekdays");
    const dayDetailList = document.getElementById("dayDetailList");
    const dayDetailTitle = document.getElementById("dayDetailTitle");

    let selectedDay = null;

    const now = new Date();
    for (let y = now.getFullYear(); y <= now.getFullYear() + 1; y++) {
      yearSelect.innerHTML += `<option value="${y}">${y} 年</option>`;
    }
    for (let m = 1; m <= 12; m++) {
      monthSelect.innerHTML += `<option value="${m}">${m} 月</option>`;
    }
    yearSelect.value = String(now.getFullYear());
    monthSelect.value = String(now.getMonth() + 1);

    function worstLevel(rows) {
      if (!rows.length) return "ok";
      if (rows.some(r => r.remaining <= 0)) return "out";
      if (rows.some(r => r.remaining <= 1)) return "tight";
      if (rows.some(r => r.remaining <= LOW_STOCK_THRESHOLD)) return "low";
      return "ok";
    }

    function renderDayDetail(year, month, day) {
      const rows = getDayPressureList(year, month, day);
      dayDetailTitle.textContent = `${year}/${month}/${day} 庫存明細`;

      if (rows.length === 0) {
        dayDetailList.innerHTML = '<p class="empty-msg">此日無明顯庫存壓力，各尺寸仍可正常租借</p>';
        return;
      }

      dayDetailList.innerHTML = rows
        .map(r => {
          const name = r.isAccessory ? r.costumeName : `${r.costumeName} ${r.size}`;
          return `
            <div class="pressure-row stock-${r.level}">
              <strong>${r.dateLabel}</strong>
              <span>${name}</span>
              <span class="pressure-remaining">剩餘 ${r.remaining} 件</span>
              <span class="stock-badge stock-${r.level}">${r.label}</span>
            </div>`;
        })
        .join("");
    }

    function renderCalendar() {
      const year = Number(yearSelect.value);
      const month = Number(monthSelect.value);
      const daysInMonth = new Date(year, month, 0).getDate();

      weekdaysEl.innerHTML = ["日", "一", "二", "三", "四", "五", "六"]
        .map(d => `<div class="weekday">${d}</div>`)
        .join("");

      calendar.innerHTML = "";
      const firstWeekday = new Date(year, month - 1, 1).getDay();
      for (let i = 0; i < firstWeekday; i++) {
        calendar.appendChild(document.createElement("div"));
      }

      for (let day = 1; day <= daysInMonth; day++) {
        const rows = getDayPressureList(year, month, day);
        const level = worstLevel(rows);
        const minRemaining = rows.length
          ? Math.min(...rows.map(r => r.remaining))
          : null;

        const div = document.createElement("button");
        div.type = "button";
        div.className = `day-cell day-cell--${level}${selectedDay === day ? " day-cell--selected" : ""}`;

        div.innerHTML = `
          <div class="date">${month}/${day}</div>
          <div class="day-cell-summary">${
            rows.length === 0
              ? "壓力低"
              : `最低剩 ${minRemaining} 件`
          }</div>
          <div class="day-cell-count">${rows.length} 筆警示</div>
        `;

        div.addEventListener("click", () => {
          selectedDay = day;
          renderDayDetail(year, month, day);
          renderCalendar();
        });

        calendar.appendChild(div);
      }

      if (selectedDay) {
        renderDayDetail(year, month, selectedDay);
      }
    }

    yearSelect.addEventListener("change", () => {
      selectedDay = null;
      dayDetailList.innerHTML = '<p class="empty-msg">請點選月曆上的日期</p>';
      dayDetailTitle.textContent = "點選日期查看庫存明細";
      renderCalendar();
    });
    monthSelect.addEventListener("change", () => {
      selectedDay = null;
      dayDetailList.innerHTML = '<p class="empty-msg">請點選月曆上的日期</p>';
      dayDetailTitle.textContent = "點選日期查看庫存明細";
      renderCalendar();
    });

    renderCalendar();
  </script>
</body>
</html>
