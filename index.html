<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>舞韻舞蹈服飾 ERP · Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600;700&family=Noto+Serif+TC:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="brand.css" />
</head>
<body>
  <div class="stage-bg" aria-hidden="true">
    <div class="neon-grid"></div>
    <div class="neon-beam neon-beam-1"></div>
    <div class="neon-beam neon-beam-2"></div>
    <div class="neon-beam neon-beam-3"></div>
    <div class="spotlight spotlight-main"></div>
    <div class="spotlight spotlight-left"></div>
    <div class="spotlight spotlight-right"></div>
    <div class="spotlight spotlight-purple"></div>
    <div class="stage-vignette"></div>
    <div class="stage-floor"></div>
  </div>

  <div class="app">
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand sidebar-brand--compact">
        <p class="sidebar-eyebrow">舞台營運 · 導航</p>
      </div>

      <nav class="sidebar-nav">
        <p class="nav-label">舞台導航</p>
        <a href="index.html" class="nav-item active">
          <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></span>
          <span class="nav-text">Dashboard</span>
        </a>
        <a href="order.html" class="nav-item">
          <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/></svg></span>
          <span class="nav-text">訂單管理</span>
        </a>
        <a href="inventory.html" class="nav-item">
          <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg></span>
          <span class="nav-text">庫存管理</span>
        </a>
        <a href="shipping.html" class="nav-item">
          <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M1 3h15v13H1zM16 8h4l3 3v5h-7V8z"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg></span>
          <span class="nav-text">出貨管理</span>
        </a>
        <a href="laundry.html" class="nav-item">
          <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"/></svg></span>
          <span class="nav-text">洗滌管理</span>
        </a>
        <a href="analytics.html" class="nav-item">
          <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg></span>
          <span class="nav-text">報表分析</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="user-pill">
          <div class="user-avatar">林</div>
          <div class="user-meta">
            <div class="name">林曉雯</div>
            <div class="role">營運總監</div>
          </div>
        </div>
      </div>
    </aside>

    <main class="main">
      <header class="header">
        <div class="header-left">
          <button class="menu-toggle" id="menuToggle" type="button" aria-label="選單">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
          </button>
          <div>
            <div class="greeting">午安，<span>曉雯</span></div>
            <div class="header-date" id="headerDate"></div>
          </div>
        </div>
        <div class="header-actions">
          <div class="search-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
            <input type="search" placeholder="搜尋訂單、款式、客戶…" />
          </div>
          <button class="icon-btn" type="button" aria-label="通知">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>
            <span class="dot"></span>
          </button>
          <button class="btn-gold" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
            建立訂單
          </button>
          <a href="index.html" class="header-logo" title="舞韻舞蹈服飾 ERP">
            <span class="header-logo-mark" aria-hidden="true">舞</span>
            <span class="header-logo-text"><strong>舞韻</strong><small>DANCE ERP</small></span>
          </a>
      </div>
      </header>

      <div class="content">
        <div class="page-intro">
          <h2>今日舞台概況</h2>
          <p>即時掌握出貨、洗滌與庫存，讓每一套表演服準時登台</p>
        </div>

        <div class="kpi-grid">
          <article class="kpi-card">
            <div class="kpi-label">今日待出貨</div>
            <div class="kpi-value" data-target="6">0</div>
            <div class="kpi-hint"><em>2</em> 筆出貨檔期衝突待調</div>
          </article>
          <article class="kpi-card">
            <div class="kpi-label">今日待修改</div>
            <div class="kpi-value" data-target="4">0</div>
            <div class="kpi-hint">民族舞、原民舞尺寸調整</div>
          </article>
          <article class="kpi-card">
            <div class="kpi-label">洗滌中</div>
            <div class="kpi-value" data-target="42">0</div>
            <div class="kpi-hint">含民族舞、街舞批次 <em>14</em> 件</div>
          </article>
          <article class="kpi-card">
            <div class="kpi-label">庫存不足</div>
            <div class="kpi-value" data-target="6">0</div>
            <div class="kpi-hint"><em>3</em> 款配件／尺寸不足</div>
          </article>
          <article class="kpi-card">
            <div class="kpi-label">今日歸位</div>
            <div class="kpi-value" data-target="15">0</div>
            <div class="kpi-hint">已檢查上架 <em>11</em> 件</div>
          </article>
        </div>

        <div class="panels-grid">
          <section class="panel">
            <div class="panel-head">
              <h3>最近訂單</h3>
              <a href="order.html" class="panel-more">查看全部</a>
            </div>
            <div class="panel-body" id="ordersList"></div>
          </section>

          <section class="panel">
            <div class="panel-head">
              <h3>庫存不足警示</h3>
              <a href="inventory.html" class="panel-more">庫存管理</a>
            </div>
            <div class="panel-body" id="stockList"></div>
          </section>

          <section class="panel">
            <div class="panel-head">
              <h3>今日出貨排程</h3>
              <a href="shipping.html" class="panel-more">出貨管理</a>
            </div>
            <div class="panel-body" id="shippingList"></div>
          </section>
        </div>
      </div>
    </main>
  </div>

  <script>
    const orders = [
      { id: 'WY-260518-001', customer: '嘉義女中舞蹈班', sub: '林佩蓉老師', items: '國風水袖服 × 18', status: 'shipping', statusText: '今日出貨', amount: 'NT$ 28,800' },
      { id: 'WY-260518-002', customer: '台南民族舞團', sub: '陳雅惠', items: '客家花布舞裙 × 14', status: 'pending', statusText: '待確認', amount: 'NT$ 19,600' },
      { id: 'WY-260518-003', customer: '星光兒童舞蹈教室', sub: '黃怡君', items: '兒童芭蕾粉 Tutu × 22', status: 'shipping', statusText: '備貨中', amount: 'NT$ 22,000' },
      { id: 'WY-260517-016', customer: '屏東原舞團', sub: '排灣族舞監', items: '原民羽飾套裝 × 10', status: 'rented', statusText: '表演中', amount: 'NT$ 16,500' },
      { id: 'WY-260516-017', customer: '雲林表演藝術中心', sub: '展演組', items: '敦煌飛天舞服 × 9', status: 'returned', statusText: '已歸還', amount: 'NT$ 14,400' },
    ];

    const stockAlerts = [
      { name: '原民羽飾套裝', stock: 2, safe: 12, level: 'critical' },
      { name: '國風水袖服 M', stock: 3, safe: 15, level: 'critical' },
      { name: '敦煌飛天舞服', stock: 5, safe: 14, level: 'warning' },
      { name: '街舞寬鬆套裝 L', stock: 6, safe: 18, level: 'warning' },
    ];

    const shippingSchedule = [
      { time: '09:00', order: 'WY-260518-001', item: '國風水袖服 × 18', customer: '嘉義女中舞蹈班' },
      { time: '09:30', order: 'WY-260518-002', item: '客家花布舞裙 × 14', customer: '台南民族舞團 · 檔期衝突' },
      { time: '11:00', order: 'WY-260518-016', item: '街舞寬鬆套裝 × 12', customer: '台南女中街舞社' },
      { time: '14:00', order: 'WY-260518-005', item: '現代黑金流蘇服 × 12', customer: '高雄青春舞團' },
      { time: '16:30', order: 'WY-260518-003', item: '兒童芭蕾粉 Tutu × 22', customer: '星光兒童舞蹈教室' },
    ];

    function renderOrders() {
      document.getElementById('ordersList').innerHTML = orders.map(o => `
        <div class="list-row orders">
          <div>
            <div class="row-id">${o.id}</div>
          </div>
          <div>
            <div class="row-primary">${o.customer}</div>
            <div class="row-secondary">${o.sub}</div>
          </div>
          <div class="row-primary" style="font-weight:400;color:var(--text-soft)">${o.items}</div>
          <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px">
            <span class="row-tag ${o.status}">${o.statusText}</span>
            <span class="row-amount">${o.amount}</span>
          </div>
        </div>
      `).join('');
    }

    function renderStock() {
      document.getElementById('stockList').innerHTML = stockAlerts.map(s => {
        const pct = Math.min(100, Math.round((s.stock / s.safe) * 100));
        const tag = s.level === 'critical' ? 'critical' : 'warning';
        const text = s.level === 'critical' ? '急需補貨' : '庫存偏低';
        return `
          <div class="list-row stock">
            <div class="item-row">
              <div class="item-icon">${s.name.slice(0, 1)}</div>
              <div>
                <div class="row-primary">${s.name}</div>
              </div>
            </div>
            <div class="stock-meter">
              <div class="stock-track">
                <div class="stock-fill ${s.level === 'critical' ? 'low' : ''}" style="width:${pct}%"></div>
              </div>
              <span class="stock-count">${s.stock} / ${s.safe}</span>
            </div>
            <span class="row-tag ${tag}">${text}</span>
          </div>
        `;
      }).join('');
    }

    function renderShipping() {
      document.getElementById('shippingList').innerHTML = shippingSchedule.map(s => `
        <div class="list-row ship">
          <div class="row-time">${s.time}</div>
          <div>
            <div class="row-id">${s.order}</div>
            <div class="row-secondary">${s.customer}</div>
          </div>
          <div class="row-primary" style="font-weight:400;color:var(--text-soft)">${s.item}</div>
        </div>
      `).join('');
    }

    function animateValue(el, target, duration = 1400) {
      const start = 0;
      const t0 = performance.now();
      function tick(now) {
        const p = Math.min((now - t0) / duration, 1);
        const eased = 1 - Math.pow(1 - p, 3);
        el.textContent = Math.round(start + (target - start) * eased);
        if (p < 1) requestAnimationFrame(tick);
        else el.classList.remove('updating');
      }
      el.classList.add('updating');
      requestAnimationFrame(tick);
    }

    function initCounters() {
      document.querySelectorAll('.kpi-value[data-target]').forEach(el => {
        animateValue(el, parseInt(el.dataset.target, 10));
      });
    }

    function updateDate() {
      const now = new Date();
      const opts = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
      document.getElementById('headerDate').textContent = now.toLocaleDateString('zh-TW', opts);
    }

    function initSidebar() {
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('sidebarOverlay');
      const close = () => {
        sidebar?.classList.remove('open');
        overlay?.classList.remove('open');
      };
      document.getElementById('menuToggle')?.addEventListener('click', () => {
        sidebar.classList.toggle('open');
        overlay.classList.toggle('open');
      });
      overlay?.addEventListener('click', close);
      document.querySelectorAll('.sidebar-nav .nav-item[href]').forEach(link => {
        link.addEventListener('click', () => {
          if (window.innerWidth <= 768) close();
        });
      });
      const current = (location.pathname.split('/').pop() || 'index.html').toLowerCase();
      document.querySelectorAll('.sidebar-nav .nav-item[href]').forEach(a => {
        a.classList.toggle('active', a.getAttribute('href').toLowerCase() === current);
      });
    }

    renderOrders();
    renderStock();
    renderShipping();
    updateDate();
    initCounters();
    initSidebar();
  </script>
</body>
</html>
